<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<title>汉语 · Mon coach de chinois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE;
  --card:#FFFFFF;
  --ink:#2C2723;
  --muted:#776E66;
  --line:#EEE4D6;
  --line2:#E2D6C4;

  --red:#B8342E;      --red-d:#8E2622;  --red-s:#FBEDEA;
  --gold:#B98526;     --gold-d:#8E651A; --gold-s:#FCF3E0;
  --jade:#3D7A69;     --jade-d:#2C5B4E; --jade-s:#E9F3F0;
  --indigo:#3C5375;   --indigo-d:#2B3D57;--indigo-s:#ECF0F7;
  --plum:#8A4260;     --plum-d:#6A3049; --plum-s:#F9EDF2;
  --clay:#A85A32;     --clay-d:#824426; --clay-s:#FBEFE6;

  --ui:'Quicksand',system-ui,-apple-system,sans-serif;
  --han:'Noto Serif SC',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-weight:600;font-size:16px;line-height:1.5;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
/* voile chaud très discret en haut = ambiance sans motif chargé */
body::before{
  content:'';position:fixed;inset:0 0 auto 0;height:280px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% 0%,rgba(184,52,46,.07),rgba(185,133,38,.05) 45%,transparent 72%);
}
button{font-family:inherit;font-weight:700;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--jade);outline-offset:3px}

.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 16px}

/* ---------- En-têtes ---------- */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
.hi{flex:1;min-width:0}
.hi h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.01em}
.hi h1 .zh{font-family:var(--han);color:var(--red)}
.hi p{margin:2px 0 0;font-size:14.5px;color:var(--muted);font-weight:600}
.streak{
  display:flex;align-items:center;gap:6px;flex:none;
  background:var(--gold-s);border:2px solid #F0DDB4;border-radius:999px;
  padding:8px 14px;font-size:16px;color:var(--gold-d);
}
.back{
  width:46px;height:46px;flex:none;border-radius:15px;background:var(--card);
  border:2px solid var(--line);display:grid;place-items:center;font-size:20px;
  box-shadow:0 3px 0 rgba(120,90,50,.07);
}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,90,50,.07)}
.htitle{flex:1;min-width:0;font-size:21px;font-weight:700}
.htitle small{display:block;font-size:13.5px;color:var(--muted);font-weight:600}

/* ---------- Filtres pastilles ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:none;padding:8px 15px;border-radius:999px;background:var(--card);
  border:2px solid var(--line);font-size:14.5px;color:var(--muted);
}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.void{opacity:.5}
.selwrap{position:relative;margin:8px 0 4px}
.selwrap select{
  width:100%;appearance:none;font-family:var(--ui);font-weight:700;font-size:15px;
  padding:12px 40px 12px 16px;border-radius:15px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);
}
.selwrap::after{content:'▾';position:absolute;right:16px;top:11px;color:var(--muted);pointer-events:none}

/* ---------- Grandes cartes ---------- */
.big{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:15px;margin-bottom:13px;box-shadow:0 4px 0 rgba(120,90,50,.06);
}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,50,.06)}
.big .ico{
  width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:29px;
}
.big .txt{flex:1;min-width:0}
.big .txt b{display:block;font-size:18.5px;font-weight:700;line-height:1.25}
.big .txt span{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.big .arrow{flex:none;font-size:19px;color:var(--line2)}
.bar{height:11px;border-radius:99px;background:#F0E9DE;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px}

.c-red{border-color:#F0CFCB}    .c-red .ico{background:var(--red-s)}    .c-red b{color:var(--red)}    .c-red .bar i{background:var(--red)}
.c-gold{border-color:#F0DDB4}   .c-gold .ico{background:var(--gold-s)}  .c-gold b{color:var(--gold-d)} .c-gold .bar i{background:var(--gold)}
.c-jade{border-color:#C6DFD8}   .c-jade .ico{background:var(--jade-s)}  .c-jade b{color:var(--jade)}   .c-jade .bar i{background:var(--jade)}
.c-indigo{border-color:#C9D5E7} .c-indigo .ico{background:var(--indigo-s)} .c-indigo b{color:var(--indigo)} .c-indigo .bar i{background:var(--indigo)}
.c-plum{border-color:#E6C9D6}   .c-plum .ico{background:var(--plum-s)}  .c-plum b{color:var(--plum)}   .c-plum .bar i{background:var(--plum)}
.c-clay{border-color:#EFD2BC}   .c-clay .ico{background:var(--clay-s)}  .c-clay b{color:var(--clay)}   .c-clay .bar i{background:var(--clay)}

/* ---------- Boutons ---------- */
.btn{
  display:block;width:100%;padding:16px 20px;border-radius:18px;
  background:var(--red);color:#fff;font-size:17px;letter-spacing:.01em;
  box-shadow:0 5px 0 var(--red-d);
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d)}
.btn.jade{background:var(--jade);box-shadow:0 5px 0 var(--jade-d)}
.btn.jade:active{box-shadow:0 1px 0 var(--jade-d)}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.pale{background:var(--card);color:var(--ink);border:2px solid var(--line2);box-shadow:0 4px 0 var(--line)}
.btn.pale:active{box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.45;box-shadow:none;transform:none}
.btn.sm{padding:12px 16px;font-size:15px;border-radius:15px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mt{margin-top:14px}

/* ---------- Blocs ---------- */
.box{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:13px}
h2.sec{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
p{margin:0 0 10px}
.mut{color:var(--muted);font-size:14.5px;font-weight:600}
.sm{font-size:13.5px}

/* ---------- Chinois et tons ---------- */
.hz{font-family:var(--han);font-weight:700}
.py{font-weight:700;letter-spacing:.01em}
.s1{color:#2F72A8} .s2{color:#3D8A46} .s3{color:#B98526} .s4{color:#B8342E} .s0{color:#9A9189}
.tonekey{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700}

/* ---------- Carte de révision ---------- */
.card3d{
  background:var(--card);border:2px solid var(--line);border-radius:26px;
  padding:34px 20px;text-align:center;box-shadow:0 5px 0 rgba(120,90,50,.06);
  min-height:230px;display:flex;flex-direction:column;justify-content:center;
}
.card3d .glyph{font-family:var(--han);font-weight:700;font-size:72px;line-height:1.15;color:var(--ink)}
.card3d .glyph.sm{font-size:44px}
.card3d .fr{font-size:22px;font-weight:700}
.card3d .py{font-size:21px;margin-top:8px}
.card3d hr{border:0;border-top:2px dashed var(--line);margin:20px 0}

/* ---------- Choix ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.opt{
  width:100%;text-align:left;padding:15px 17px;border-radius:18px;
  background:var(--card);border:2px solid var(--line);font-size:16.5px;
  box-shadow:0 4px 0 rgba(120,90,50,.05);
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,50,.05)}
.opt.ok{border-color:var(--jade);background:var(--jade-s);color:var(--jade-d);box-shadow:0 4px 0 #C6DFD8}
.opt.no{border-color:var(--red);background:var(--red-s);color:var(--red-d);box-shadow:0 4px 0 #F0CFCB}
.verdict{border-radius:18px;padding:14px 16px;font-size:14.5px;margin-bottom:12px}
.verdict.ok{background:var(--jade-s);color:var(--jade-d)}
.verdict.no{background:var(--red-s);color:var(--red-d)}

/* ---------- Étiquettes ---------- */
.tiles{display:flex;flex-wrap:wrap;gap:9px}
.tile{
  font-family:var(--han);font-weight:700;font-size:21px;padding:9px 15px;border-radius:15px;
  background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 rgba(120,90,50,.05);
}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,90,50,.05)}
.drop{min-height:64px;border:2px dashed var(--line2);border-radius:18px;padding:9px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:#FEFCF8}

/* ---------- Chemin de leçon ---------- */
.path{padding:14px 0 10px;position:relative}
.node{display:block;margin-bottom:26px;text-align:center;width:132px}
.node .circle{
  width:86px;height:86px;margin:0 auto;border-radius:50%;
  background:var(--card);border:5px solid var(--line2);
  display:grid;place-items:center;font-size:29px;font-weight:700;color:var(--line2);
  box-shadow:0 6px 0 rgba(120,90,50,.08);
}
.node .lab{display:block;font-size:13.5px;color:var(--muted);margin-top:9px;line-height:1.3}
.node:active .circle{transform:translateY(4px);box-shadow:0 2px 0 rgba(120,90,50,.08)}
.node.open .circle{border-color:var(--red);color:var(--red)}
.node.open .lab{color:var(--ink)}
.node.done .circle{background:var(--red);border-color:var(--red);color:#fff}
.node.n0{margin-left:6%}   .node.n1{margin-left:34%}
.node.n2{margin-left:46%}  .node.n3{margin-left:34%}
.node.n4{margin-left:6%}   .node.n5{margin-left:2%}

/* ---------- Bandeau parcours ---------- */
.ribbon{
  display:flex;align-items:center;gap:10px;background:var(--red-s);border:2px solid #F0CFCB;
  border-radius:18px;padding:11px 14px;margin-bottom:14px;font-size:14px;color:var(--red-d);
}
.ribbon button{margin-left:auto;flex:none;background:var(--red);color:#fff;border-radius:12px;padding:8px 13px;font-size:13.5px}

/* ---------- Sceau ---------- */
.seal{
  display:inline-grid;place-items:center;width:30px;height:30px;flex:none;
  border:2.5px solid var(--red);border-radius:7px;color:var(--red);
  font-family:var(--han);font-weight:700;font-size:15px;
}

/* ---------- Statistiques ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:15px}
.kpi b{display:block;font-size:30px;line-height:1.1}
.kpi span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- Champs ---------- */
textarea,input[type=password],input[type=text]{
  width:100%;font-family:var(--ui);font-weight:600;font-size:16px;
  padding:14px;border-radius:18px;border:2px solid var(--line);background:#FEFCF8;color:var(--ink);
}
textarea{font-family:var(--han);font-size:19px;line-height:1.8;resize:vertical}
input[type=range]{width:100%;accent-color:var(--red)}

/* ---------- Onglets ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-top:2px solid var(--line);
  display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));
}
.tabs button{flex:1;padding:5px 2px;color:var(--muted);font-size:11px;font-weight:700}
.tabs button i{display:block;font-size:22px;font-style:normal;line-height:1.35;filter:grayscale(1) opacity(.55)}
.tabs button.on{color:var(--red)}
.tabs button.on i{filter:none}

/* ---------- Divers ---------- */
.void{text-align:center;padding:44px 20px;color:var(--muted)}
.void .em{font-size:44px;display:block;margin-bottom:12px}
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:16px;font-size:14.5px;
  z-index:60;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.sentence{font-family:var(--han);font-weight:500;font-size:22px;line-height:1.95}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const KEY='coach-chinois-v2';
let memoryOnly=false;
function loadState(){
  const base={items:{},written:[],lessons:{},streak:{n:0,last:''},
    settings:{level:2,theme:'all',provider:'none',apikey:'',rate:.85}};
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return base;
    const p=JSON.parse(raw);
    return Object.assign(base,p,{settings:Object.assign(base.settings,p.settings||{})});
  }catch(e){memoryOnly=true;return base;}
}
function save(){
  if(memoryOnly)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memoryOnly=true;}
}

const TONES={'āēīōūǖ':1,'áéíóúǘ':2,'ǎěǐǒǔǚ':3,'àèìòùǜ':4};
function toneOf(syl){
  for(const c of syl.toLowerCase())
    for(const k in TONES) if(k.includes(c)) return TONES[k];
  return 0;
}
function pinyin(py){
  return py.split(/(\s+|[,，.。?？!！])/).map(p=>{
    if(!p.trim()||/^[,，.。?？!！]$/.test(p))return esc(p);
    return `<span class="s${toneOf(p)}">${esc(p)}</span>`;
  }).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div');d.className='toast';d.textContent=m;
  document.body.appendChild(d);setTimeout(()=>d.remove(),3400);
}

/* --- Série de jours --- */
function touchStreak(){
  const d=new Date().toDateString();
  if(S.streak.last===d)return;
  const y=new Date(Date.now()-864e5).toDateString();
  S.streak.n=(S.streak.last===y)?S.streak.n+1:1;
  S.streak.last=d;save();
}

/* --- Répétition espacée (Leitner) --- */
const BOXES=[0,1,3,7,21,60];
function rec(id){if(!S.items[id])S.items[id]={box:0,due:0,seen:0,ok:0,ko:0};return S.items[id];}
function due(id){const r=S.items[id];return !r||r.due<=Date.now();}
function grade(id,g){
  const r=rec(id);r.seen++;
  if(g===0){r.box=0;r.ko++;}
  else if(g===1){r.box=Math.max(0,r.box-1);r.ko++;}
  else{r.box=Math.min(BOXES.length-1,r.box+1);r.ok++;}
  r.due=Date.now()+BOXES[r.box]*864e5;
  touchStreak();save();
}
function mastered(id){const r=S.items[id];return !!r&&r.box>=4;}

/* --- Filtres --- */
function fits(o){
  if(o.hsk!==S.settings.level)return false;
  const T=S.settings.theme;
  if(T!=='all'&&!(o.th||[]).includes(T))return false;
  return true;
}
function pool(){return WORDS.filter(fits);}
function themeName(id){const t=THEMES.find(x=>x.id===id);return t?t.n:'';}

/* --- Voix --- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if(typeof speechSynthesis!=='undefined'&&speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function zhVoice(){return voices.find(v=>/^zh/i.test(v.lang));}
function speak(t){
  if(typeof speechSynthesis==='undefined'||!speechSynthesis)return toast('Synthèse vocale indisponible.');
  const v=zhVoice();
  if(!v)return toast('Aucune voix chinoise sur cet appareil. Ajoutez le pack de langue chinois dans les réglages du système.');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.voice=v;u.lang=v.lang;u.rate=S.settings.rate;
  speechSynthesis.speak(u);
}

/* --- Correction assistée (facultative) --- */
async function correct(text,consigne){
  const p=S.settings.provider,k=S.settings.apikey;
  if(p==='none'||!k)throw new Error('aucune clé');
  const prompt=`Tu es professeur de chinois pour une apprenante francophone de niveau HSK${S.settings.level}.
Consigne : ${consigne}
Texte de l’apprenante :
${text}

Réponds en français, brièvement :
1. Version corrigée en chinois, avec pinyin.
2. Les erreurs, une par ligne : écrit → attendu, puis la règle en une phrase.
3. Une reformulation plus naturelle si elle existe.
Pas de préambule ni de conclusion.`;
  if(p==='anthropic'){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
    if(!r.ok)throw new Error('erreur '+r.status);
    const d=await r.json();
    return d.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
  }
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(k),
    {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  if(!r.ok)throw new Error('erreur '+r.status);
  const d=await r.json();
  return ((d.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('\n');
}

let W=null;
function mountWriter(){
  const el=document.getElementById('tian');if(!el)return;
  const st=document.getElementById('wstatus');
  const c=CHARS.find(x=>x.id===ctx.c);
  if(typeof HanziWriter==='undefined'){

    return;
  }
  el.innerHTML='';
  W=HanziWriter.create(el,c.hz,{width:230,height:230,padding:14,
    showCharacter:true,showOutline:true,delayBetweenStrokes:170,
    strokeColor:'#2C2723',outlineColor:'#E2D6C4',drawingColor:'#B8342E',highlightColor:'#3D7A69'});
  if(st)st.textContent='« Animer » montre l’ordre des traits. « Tracer » vous fait écrire au doigt.';
}
function anim(){if(W)W.animateCharacter();}
function quiz(){
  if(!W)return;
  const c=CHARS.find(x=>x.id===ctx.c);
  W.hideCharacter();
  W.quiz({onComplete(d){
    grade(c.id,d.totalMistakes===0?2:(d.totalMistakes<=2?1:0));
    toast(d.totalMistakes===0?'Tracé juste, sans erreur !':d.totalMistakes+' erreur(s) de tracé.');
    W.showCharacter();render();
  }});
}

/* ---------- Production écrite ---------- */
function vProd(){
  const P=PROD.filter(fits);
  if(!P.length)return header('Production écrite')+levelPills()+nothing();
  ctx.p=ctx.p||P[0].id;
  const p=P.find(x=>x.id===ctx.p)||P[0];
  const lbl={ordre:'Remettre en ordre',trad:'Traduire',libre:'Écrire librement'};
  return header('Production écrite',lbl[p.type])+ribbon()+`
  <div class="pills">${P.map(x=>`<button class="pill ${x.id===p.id?'on':''}"
    onclick="ctx.p='${x.id}';ctx.built=[];ctx.res=null;ctx.aiout=null;render()">${lbl[x.type]}</button>`).join('')}</div>
  ${p.type==='ordre'?pOrdre(p):p.type==='trad'?pTrad(p):pLibre(p)}
  ${S.written.length?`<h2 class="sec">Mon carnet</h2>
    ${S.written.slice().reverse().slice(0,6).map(e=>`<div class="box">
      <p class="mut sm" style="margin:0 0 6px">${new Date(e.t).toLocaleDateString('fr-FR')}</p>
      <div class="sentence" style="font-size:19px">${esc(e.txt)}</div>
      ${e.corr?`<p class="sm" style="white-space:pre-wrap;border-top:2px dashed var(--line);padding-top:10px;margin-top:10px">${esc(e.corr)}</p>`:''}
    </div>`).join('')}`:''}`;
}
const shuffled={};
function pOrdre(p){
  ctx.built=ctx.built||[];
  const used=ctx.built.slice(),rest=[];
  p.words.forEach(w=>{const k=used.indexOf(w);if(k>=0)used.splice(k,1);else rest.push(w);});
  if(!shuffled[p.id])shuffled[p.id]=shuffle(p.words);
  const order=shuffled[p.id].filter(w=>rest.includes(w));
  const bag=[];const tmp=rest.slice();
  order.forEach(w=>{const k=tmp.indexOf(w);if(k>=0){bag.push(w);tmp.splice(k,1);}});
  tmp.forEach(w=>bag.push(w));
  const done=ctx.built.join('')===p.ok;
  return `<div class="box">
    <p><b>${esc(p.consigne)}</b></p>
    <p class="mut sm">${esc(p.fr)}</p>
    <div class="drop">${ctx.built.map((w,i)=>`<button class="tile" onclick="unbuild(${i})">${esc(w)}</button>`).join('')
      ||'<span class="mut sm" style="padding:0 6px">Touchez les mots dans l’ordre</span>'}</div>
    <div class="tiles mt">${bag.map((w,i)=>`<button class="tile" onclick="build(${i},'${js(p.id)}')">${esc(w)}</button>`).join('')}</div>
    ${!bag.length?`<div class="verdict ${done?'ok':'no'} mt">${done?'✓ Phrase juste !':'✗ Ordre incorrect. Réponse : '+esc(p.ok)}</div>`:''}
    <button class="btn pale mt" onclick="ctx.built=[];render()">Recommencer</button>
  </div>`;
}
function build(i,pid){
  const p=PROD.find(x=>x.id===pid);
  const used=(ctx.built||[]).slice(),rest=[];
  p.words.forEach(w=>{const k=used.indexOf(w);if(k>=0)used.splice(k,1);else rest.push(w);});
  const order=shuffled[pid].filter(w=>rest.includes(w));
  const bag=[];const tmp=rest.slice();
  order.forEach(w=>{const k=tmp.indexOf(w);if(k>=0){bag.push(w);tmp.splice(k,1);}});
  tmp.forEach(w=>bag.push(w));
  ctx.built=(ctx.built||[]).concat(bag[i]);
  if(ctx.built.length===p.words.length)touchStreak();
  render();
}
function unbuild(i){ctx.built.splice(i,1);render();}
function pTrad(p){
  return `<div class="box">
    <p><b>${esc(p.consigne)}</b></p>
    <p class="mut">${esc(p.fr)}</p>
    <textarea id="ta" rows="3" placeholder="Écrivez en chinois…">${esc(ctx.txt||'')}</textarea>
    <div class="row mt">
      <button class="btn gold sm" onclick="keepTxt();ctx.res='m';render()">Voir le modèle</button>
      <button class="btn jade sm" onclick="askAI('${p.id}')">Corriger</button>
    </div>
    <button class="btn pale sm mt" onclick="keep('${p.id}')">Garder dans mon carnet</button>
    ${ctx.res==='m'?`<div class="verdict ok mt"><div class="sentence" style="font-size:20px">${esc(p.ok)}</div>
      <p class="sm" style="margin:6px 0 0">Comparez structure par structure : plusieurs formulations sont justes.</p></div>`:''}
    ${ctx.aiout?`<div class="verdict ok mt" style="white-space:pre-wrap">${esc(ctx.aiout)}</div>`:''}
  </div>`;
}
function pLibre(p){
  return `<div class="box">
    <p><b>${esc(p.consigne)}</b></p>
    <textarea id="ta" rows="7" placeholder="Écrivez librement…">${esc(ctx.txt||'')}</textarea>
    <div class="row mt">
      <button class="btn gold sm" onclick="keepTxt();ctx.res='m';render()">Voir un modèle</button>
      <button class="btn jade sm" onclick="askAI('${p.id}')">Corriger</button>
    </div>
    <button class="btn pale sm mt" onclick="keep('${p.id}')">Garder dans mon carnet</button>
    <p class="mut sm mt">Sans clé de correction, écrivez quand même : le texte est conservé et pourra être corrigé plus tard.</p>
    ${ctx.res==='m'&&p.modele?`<div class="verdict ok mt"><div class="sentence" style="font-size:19px">${esc(p.modele)}</div></div>`:''}
    ${ctx.aiout?`<div class="verdict ok mt" style="white-space:pre-wrap">${esc(ctx.aiout)}</div>`:''}
  </div>`;
}
function keepTxt(){const t=document.getElementById('ta');if(t)ctx.txt=t.value;}
function keep(pid){
  keepTxt();
  if(!ctx.txt||!ctx.txt.trim())return toast('Rien à garder pour le moment.');
  const p=PROD.find(x=>x.id===pid);
  S.written.push({t:Date.now(),c:p.consigne,txt:ctx.txt.trim(),corr:ctx.aiout||''});
  touchStreak();save();ctx.txt='';ctx.aiout=null;render();toast('Ajouté à votre carnet.');
}
async function askAI(pid){
  keepTxt();
  if(!ctx.txt||!ctx.txt.trim())return toast('Écrivez d’abord quelque chose.');
  if(S.settings.provider==='none'||!S.settings.apikey)
    return toast('Aucune clé configurée. Voir Réglages, ou utilisez le modèle.');
  ctx.aiout='Correction en cours…';render();
  try{
    const p=PROD.find(x=>x.id===pid);
    ctx.aiout=await correct(ctx.txt,p.consigne);
    touchStreak();
  }catch(e){ctx.aiout='La correction a échoué ('+e.message+'). Vérifiez la clé dans Réglages.';}
  render();
}

function vLecon(){
  const l=LESSONS.find(x=>x.id===ctx.l);
  if(!l)return vParcours();
  const done=S.lessons[l.id]||[];
  const words=WORDS.filter(w=>w.hsk===l.hsk&&w.th.includes(l.theme));
  const nodes=l.steps.map((s,i)=>{
    const isDone=done.includes(i);
    const open=isDone||i===0||done.includes(i-1);
    return `<button class="node n${i%6} ${isDone?'done':open?'open':''}"
      onclick="${open?`openStep('${l.id}',${i})`:`toast('Terminez d’abord l’étape précédente.')`}">
      <span class="circle">${isDone?'✓':i+1}</span>
      <span class="lab">${esc(s.label)}</span></button>`;
  }).join('');
  const m=words.filter(w=>mastered(w.id)).length;
  return header(l.title,l.intro)+`
  <div class="box">
    <p class="mut sm" style="margin:0 0 8px">Progression du thème</p>
    <div class="bar"><i style="width:${done.length/l.steps.length*100}%"></i></div>
    <p class="mut sm" style="margin:10px 0 0">${done.length} / ${l.steps.length} étapes · ${m} mot${m>1?'s':''} acquis sur ${words.length}</p>
  </div>
  <div class="path">${nodes}</div>
  ${done.length===l.steps.length?`<div class="box" style="text-align:center">
    <p style="font-size:40px;margin:0">🏆</p><p><b>Thème terminé</b></p>
    <p class="mut sm">Passez au niveau supérieur pour reprendre le même thème avec plus de moyens.</p></div>`:''}`;
}
function openStep(lid,i){
  const l=LESSONS.find(x=>x.id===lid),s=l.steps[i];
  const from={l:lid,i:i};
  if(s.k==='vocab')return go('vocab',{from:from});
  if(s.k==='bilan')return go('vocab',{from:from});
  if(s.k==='gram')return go('gram',{g:s.ref,from:from});
  if(s.k==='prod')return go('prod',{p:s.ref,from:from});
  const t=TEXTS.find(x=>x.id===s.ref);
  return go(t.mode==='CO'?'co':'ce',{t:s.ref,from:from});
}

/* ---------- Progrès ---------- */
function vProgres(){
  const all=WORDS.concat(CHARS);
  const seen=all.filter(w=>S.items[w.id]).length;
  const mast=all.filter(w=>mastered(w.id)).length;
  const todo=pool().filter(w=>due(w.id)).length;
  const boxes=[0,1,2,3,4,5].map(b=>all.filter(w=>S.items[w.id]&&S.items[w.id].box===b).length);
  const maxb=Math.max(1,...boxes);
  return `<div class="top"><div class="hi"><h1>Mes progrès</h1><p>Tous niveaux confondus</p></div>
    <div class="streak">🔥 <b>${S.streak.n}</b></div></div>
  <div class="grid2">
    <div class="kpi"><b style="color:var(--red)">${todo}</b><span>à réviser au filtre</span></div>
    <div class="kpi"><b style="color:var(--gold-d)">${seen}</b><span>mots rencontrés</span></div>
    <div class="kpi"><b style="color:var(--jade)">${mast}</b><span>mots acquis</span></div>
    <div class="kpi"><b style="color:var(--indigo)">${S.written.length}</b><span>écrits produits</span></div>
  </div>
  <h2 class="sec">Répartition par boîte</h2>
  <div class="box">
    ${boxes.map((n,b)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      <span class="mut sm" style="width:58px;flex:none">Boîte ${b}</span>
      <span class="bar" style="flex:1;margin:0"><i style="width:${n/maxb*100}%;background:${b>=4?'var(--jade)':b>=2?'var(--gold)':'var(--red)'}"></i></span>
      <span class="sm" style="width:26px;text-align:right">${n}</span></div>`).join('')}
    <p class="mut sm" style="margin:10px 0 0">Un mot monte d’une boîte à chaque réussite. Boîte 4 ou 5 = acquis. Un échec le renvoie en boîte 0.</p>
  </div>
  <h2 class="sec">Parcours</h2>
  ${LESSONS.map(l=>{const p=(S.lessons[l.id]||[]).length;
    return `<div class="big c-red" style="cursor:default"><span class="ico">${p>=l.steps.length?'🏆':'🏮'}</span>
    <span class="txt"><b style="font-size:16px">${esc(l.title)}</b><span>${p} / ${l.steps.length} étapes</span>
    <span class="bar"><i style="width:${p/l.steps.length*100}%"></i></span></span></div>`;}).join('')}`;
}

/* ---------- Réglages ---------- */
function vReglages(){
  const v=zhVoice();
  return `<div class="top"><div class="hi"><h1>Réglages</h1><p>Voix, correction, sauvegarde</p></div></div>
  <h2 class="sec">Voix chinoise</h2>
  <div class="box">
    <p class="sm">${v?`Voix détectée : <b>${esc(v.name)}</b>`:'<b>Aucune voix chinoise détectée.</b> Ajoutez le pack de langue chinois dans les réglages de votre téléphone pour activer l’écoute.'}</p>
    <p class="mut sm">Vitesse — ${S.settings.rate.toFixed(2)}×</p>
    <input type="range" min="0.5" max="1.2" step="0.05" value="${S.settings.rate}"
      oninput="S.settings.rate=parseFloat(this.value);save();render()">
    <button class="btn jade mt" onclick="speak('你好，很高兴认识你。')">🔊 Tester la voix</button>
  </div>
  <h2 class="sec">Correction des écrits</h2>
  <div class="box">
    <p class="mut sm">L’application fonctionne entièrement sans clé. Une clé ajoute la correction des phrases libres. Elle reste dans ce navigateur.</p>
    <div class="selwrap"><select onchange="S.settings.provider=this.value;save();render()">
      <option value="none" ${S.settings.provider==='none'?'selected':''}>Aucune — modèle seul</option>
      <option value="gemini" ${S.settings.provider==='gemini'?'selected':''}>Google Gemini — gratuit</option>
      <option value="anthropic" ${S.settings.provider==='anthropic'?'selected':''}>Anthropic — payant à l’usage</option>
    </select></div>
    ${S.settings.provider!=='none'?`
      <input type="password" placeholder="Collez la clé ici" value="${esc(S.settings.apikey)}"
        onchange="S.settings.apikey=this.value;save();toast('Clé enregistrée sur cet appareil.')" style="margin-top:10px">
      <p class="mut sm">${S.settings.provider==='gemini'
        ?'Clé gratuite via Google AI Studio. Sur le palier gratuit, les données envoyées peuvent servir à entraîner le modèle.'
        :'Clé via la console Anthropic. Facturation à la consommation, indépendante de l’abonnement Claude.'}</p>`:''}
  </div>
  <h2 class="sec">Ma progression</h2>
  <div class="box">
    <button class="btn pale" onclick="exportJSON()">Exporter dans un fichier</button>
    <button class="btn pale mt" onclick="document.getElementById('imp').click()">Importer un fichier</button>
    <button class="btn pale mt" style="color:var(--red)" onclick="wipe()">Tout effacer</button>
    <input type="file" id="imp" accept="application/json" class="hidden" onchange="importJSON(this)">
    <p class="mut sm mt">Exportez avant de changer d’appareil : la progression est stockée dans ce navigateur uniquement.</p>
  </div>`;
}
function exportJSON(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='coach-chinois-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render();toast('Progression importée.');}
    catch(e){toast('Fichier illisible.');}};
  r.readAsText(f);
}
function wipe(){
  if(!confirm('Effacer toute la progression ? Cette action est définitive.'))return;
  S.items={};S.written=[];S.lessons={};S.streak={n:0,last:''};save();render();toast('Progression effacée.');
}

render();
</script>
</body>
</html>
