<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#FBF6EE">
<title>汉语 · Mon coach de chinois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE;
  --card:#FFFFFF;
  --ink:#2C2723;
  --muted:#776E66;
  --line:#EEE4D6;
  --line2:#E2D6C4;

  --red:#B8342E;      --red-d:#8E2622;  --red-s:#FBEDEA;
  --gold:#B98526;     --gold-d:#8E651A; --gold-s:#FCF3E0;
  --jade:#3D7A69;     --jade-d:#2C5B4E; --jade-s:#E9F3F0;
  --indigo:#3C5375;   --indigo-d:#2B3D57;--indigo-s:#ECF0F7;
  --plum:#8A4260;     --plum-d:#6A3049; --plum-s:#F9EDF2;
  --clay:#A85A32;     --clay-d:#824426; --clay-s:#FBEFE6;

  --ui:'Quicksand',system-ui,-apple-system,sans-serif;
  --han:'Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-weight:600;font-size:16px;line-height:1.5;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-weight:700;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--jade);outline-offset:3px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
.hz,.sentence,.tile,.py,.opt.han,.emb{font-family:var(--han)}

/* ---------- Bandeau haut ---------- */
.top{display:flex;align-items:center;gap:12px;padding:16px 0 8px}
.back{
  width:46px;height:46px;flex:none;border-radius:16px;background:var(--card);
  border:2px solid var(--line);display:grid;place-items:center;
  box-shadow:0 3px 0 rgba(120,90,50,.08);
}
.back svg{width:20px;height:20px}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,90,50,.08)}
.htitle{flex:1;min-width:0;font-size:21px;font-weight:700;line-height:1.25}
.htitle small{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}

/* ---------- Panneau d’accueil (signature) ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;margin:14px 0 6px;
  background:linear-gradient(158deg,#C43B32 0%,#A32B26 58%,#8E2622 100%);color:#FFF6EC;
}
.hero .mark{
  position:absolute;right:-14px;bottom:-42px;font-family:var(--han);font-weight:700;
  font-size:150px;line-height:1;color:#fff;opacity:.11;pointer-events:none;
}
.hero .rule{height:2px;background:rgba(255,255,255,.28);margin:13px 0;border-radius:2px}
.hero h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;position:relative;z-index:1}
.hero .sub{font-size:14px;opacity:.86;margin-top:2px;position:relative;z-index:1}
.hero .figs{display:flex;gap:24px;position:relative;z-index:1}
.hero .fig b{display:block;font-size:27px;line-height:1.1}
.hero .fig span{display:block;font-size:11.5px;opacity:.82;letter-spacing:.04em}
.hero .cta{
  display:block;width:100%;margin-top:15px;padding:15px;border-radius:17px;
  background:#FFF6EC;color:var(--red-d);font-size:16.5px;box-shadow:0 5px 0 rgba(0,0,0,.2);position:relative;z-index:1;
}
.hero .cta:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}

/* ---------- Grille de modules ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mod{
  background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:14px;text-align:left;box-shadow:0 4px 0 rgba(120,90,50,.06);
  display:flex;flex-direction:column;gap:6px;min-height:126px;
}
.mod:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,50,.06)}
.mod .emb{font-size:32px;font-weight:700;line-height:1}
.mod b{font-size:15px;font-weight:700;line-height:1.25;margin-top:auto}
.mod span{font-size:11.5px;color:var(--muted);line-height:1.3}
.mod.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:14px;min-height:0}
.mod.wide .emb{font-size:38px}
.mod.wide .col{flex:1;min-width:0}
.mod.wide b{margin-top:0;display:block;font-size:17px}

.c-red{border-color:#F0CFCB}    .c-red .emb,.c-red b{color:var(--red)}          .c-red .bar i{background:var(--red)}
.c-gold{border-color:#F0DDB4}   .c-gold .emb,.c-gold b{color:var(--gold-d)}     .c-gold .bar i{background:var(--gold)}
.c-jade{border-color:#C6DFD8}   .c-jade .emb,.c-jade b{color:var(--jade)}       .c-jade .bar i{background:var(--jade)}
.c-indigo{border-color:#C9D5E7} .c-indigo .emb,.c-indigo b{color:var(--indigo)} .c-indigo .bar i{background:var(--indigo)}
.c-plum{border-color:#E6C9D6}   .c-plum .emb,.c-plum b{color:var(--plum)}       .c-plum .bar i{background:var(--plum)}
.c-clay{border-color:#EFD2BC}   .c-clay .emb,.c-clay b{color:var(--clay)}       .c-clay .bar i{background:var(--clay)}

.bar{height:9px;border-radius:99px;background:#F0E9DE;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}

/* ---------- Pastilles de filtre ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 15px;border-radius:999px;background:var(--card);
  border:2px solid var(--line);font-size:14.5px;color:var(--muted)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.void{opacity:.45}
.selwrap{position:relative;margin:8px 0 2px}
.selwrap select{width:100%;appearance:none;font-family:var(--ui);font-weight:700;font-size:15px;
  padding:12px 40px 12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.selwrap::after{content:'▾';position:absolute;right:16px;top:11px;color:var(--muted);pointer-events:none}

/* ---------- Blocs ---------- */
.box{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
h2.sec{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 11px}
p{margin:0 0 10px}
.mut{color:var(--muted);font-size:14.5px;font-weight:600}
.sm{font-size:13.5px}
.mt{margin-top:12px}
.row{display:flex;gap:9px}
.row>*{flex:1}

/* ---------- Boutons ---------- */
.btn{display:block;width:100%;padding:15px 16px;border-radius:17px;
  background:var(--red);color:#fff;font-size:16.5px;box-shadow:0 5px 0 var(--red-d)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d)}
.btn.jade{background:var(--jade);box-shadow:0 5px 0 var(--jade-d)}
.btn.jade:active{box-shadow:0 1px 0 var(--jade-d)}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.pale{background:var(--card);color:var(--ink);border:2px solid var(--line2);box-shadow:0 4px 0 var(--line)}
.btn.pale:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{padding:11px 12px;font-size:14.5px;border-radius:14px}
.btn.tiny{width:auto;display:inline-block;padding:9px 16px;font-size:14px;border-radius:13px}

/* ---------- Carte de révision ---------- */
.card3d{background:var(--card);border:2px solid var(--line);border-radius:26px;
  padding:30px 20px;text-align:center;box-shadow:0 5px 0 rgba(120,90,50,.06)}
.card3d .glyph{font-family:var(--han);font-weight:700;font-size:70px;line-height:1.2}
.card3d .glyph.sm{font-size:42px}
.card3d .fr{font-size:21px;font-weight:700}
.card3d .py{font-size:20px;margin-top:6px}
.card3d hr{border:0;border-top:2px dashed var(--line);margin:18px 0}
.judge{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.judge button{padding:14px 4px;border-radius:16px;font-size:14.5px;line-height:1.2}

/* ---------- Tons ---------- */
.s1{color:#2F72A8} .s2{color:#3D8A46} .s3{color:#B98526} .s4{color:#B8342E} .s0{color:#8E857D}

/* ---------- Choix ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:17px;background:var(--card);
  border:2px solid var(--line);font-size:16.5px;box-shadow:0 4px 0 rgba(120,90,50,.05)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,50,.05)}
.opt.ok{border-color:var(--jade);background:var(--jade-s);color:var(--jade-d);box-shadow:0 4px 0 #C6DFD8}
.opt.no{border-color:var(--red);background:var(--red-s);color:var(--red-d);box-shadow:0 4px 0 #F0CFCB}
.verdict{border-radius:17px;padding:13px 15px;font-size:14.5px;margin-bottom:10px}
.verdict.ok{background:var(--jade-s);color:var(--jade-d)}
.verdict.no{background:var(--red-s);color:var(--red-d)}

/* ---------- Étiquettes ---------- */
.tiles{display:flex;flex-wrap:wrap;gap:9px}
.tile{font-weight:700;font-size:21px;padding:9px 15px;border-radius:15px;background:var(--card);
  border:2px solid var(--line);box-shadow:0 3px 0 rgba(120,90,50,.05)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,90,50,.05)}
.drop{min-height:62px;border:2px dashed var(--line2);border-radius:17px;padding:9px;
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:#FEFCF8}

/* ---------- Chemin en sceaux ---------- */
.path{position:relative;padding:6px 0 4px}
.path::before{content:'';position:absolute;left:32px;top:16px;bottom:50px;width:3px;
  background:repeating-linear-gradient(to bottom,var(--line2) 0 7px,transparent 7px 15px)}
.pstep{display:flex;gap:15px;align-items:center;width:100%;text-align:left;
  padding:7px 0;margin-bottom:5px;position:relative}
.pseal{width:66px;height:66px;flex:none;border-radius:19px;background:var(--card);
  border:3px solid var(--line2);display:grid;place-items:center;
  font-family:var(--han);font-weight:700;font-size:26px;color:var(--line2);
  box-shadow:0 4px 0 rgba(120,90,50,.08)}
.pstep:active .pseal{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,50,.08)}
.pstep .lab{flex:1;min-width:0}
.pstep .lab b{display:block;font-size:15.5px;color:var(--muted);line-height:1.3}
.pstep .lab span{display:block;font-size:12.5px;color:var(--line2);margin-top:2px}
.pstep.open .pseal{border-color:var(--red);color:var(--red)}
.pstep.open .lab b{color:var(--ink)}
.pstep.open .lab span{color:var(--muted)}
.pstep.done .pseal{background:var(--red);border-color:var(--red);color:#FFF6EC}
.pstep.done .lab b{color:var(--ink)}
.pstep.done .lab span{color:var(--jade)}

/* ---------- Bandeau parcours ---------- */
.ribbon{display:flex;align-items:center;gap:9px;background:var(--red-s);border:2px solid #F0CFCB;
  border-radius:17px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;color:var(--red-d)}
.ribbon .rs{width:28px;height:28px;flex:none;border-radius:8px;background:var(--red);color:#FFF6EC;
  display:grid;place-items:center;font-family:var(--han);font-size:15px;font-weight:700}
.ribbon button{margin-left:auto;flex:none;background:var(--red);color:#fff;border-radius:12px;padding:8px 14px;font-size:13.5px}

/* ---------- Sceau d’acquis ---------- */
.seal{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;
  border:2.5px solid var(--red);border-radius:8px;color:var(--red);
  font-family:var(--han);font-weight:700;font-size:15px}

/* ---------- Liste de mots ---------- */
.wrow{display:flex;align-items:center;gap:13px;background:var(--card);border:2px solid var(--line);
  border-radius:18px;padding:12px 14px;margin-bottom:9px}
.wrow .g{font-family:var(--han);font-weight:700;font-size:25px;flex:none;min-width:56px}
.wrow .m{flex:1;min-width:0}
.wrow .m b{display:block;font-size:15px}
.wrow .m span{display:block;font-size:13.5px;font-weight:600}
.wrow .st{font-size:12px;color:var(--muted);flex:none}

/* ---------- Statistiques ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:15px}
.kpi b{display:block;font-size:29px;line-height:1.1}
.kpi span{display:block;font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- Champs ---------- */
textarea,input[type=password],input[type=text]{width:100%;font-family:var(--ui);font-weight:600;
  font-size:16px;padding:14px;border-radius:17px;border:2px solid var(--line);background:#FEFCF8;color:var(--ink)}
textarea{font-family:var(--han);font-size:19px;line-height:1.8;resize:vertical}
input[type=range]{width:100%;accent-color:var(--red)}

/* ---------- Onglets ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
  backdrop-filter:blur(8px);border-top:2px solid var(--line);
  display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;padding:3px 2px;color:var(--muted);font-size:11px;font-weight:700}
.tabs button svg{display:block;margin:0 auto 3px;width:23px;height:23px}
.tabs button.on{color:var(--red)}

/* ---------- Flux question par question ---------- */
.qprog{display:flex;gap:5px;margin:4px 0 14px}
.qprog i{flex:1;height:6px;border-radius:3px;background:#F0E9DE}
.qprog i.ok{background:var(--jade)}
.qprog i.no{background:var(--red)}
.qprog i.now{background:var(--ink)}
.qnum{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.prompt{text-align:center;padding:18px 8px 6px}
.prompt .big{font-family:var(--han);font-weight:700;font-size:56px;line-height:1.2}
.prompt .med{font-size:22px;font-weight:700;line-height:1.35}
.score{text-align:center;padding:10px 0 4px}
.score .n{font-size:50px;font-weight:700;line-height:1}
.score .n small{font-size:22px;color:var(--muted)}
.score .lbl{font-size:13.5px;color:var(--muted);margin-top:4px}
.vsel{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.vsel .who{width:88px;flex:none;font-size:13.5px;color:var(--muted)}
.vsel .selwrap{flex:1;margin:0}
.sw{display:flex;align-items:center;gap:12px;padding:13px 0}
.sw .lb{flex:1;font-size:15px}
.sw .kn{width:52px;height:30px;flex:none;border-radius:999px;background:var(--line2);position:relative}
.sw .kn::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on .kn{background:var(--jade)}
.sw.on .kn::after{left:25px}

/* ---------- Divers ---------- */
.void{text-align:center;padding:40px 20px;color:var(--muted)}
.void .em{font-family:var(--han);font-size:46px;font-weight:700;color:var(--line2);display:block;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:16px;font-size:14.5px;
  z-index:60;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.sentence{font-weight:500;font-size:22px;line-height:1.95}
.hidden{display:none}
@media (max-width:340px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
<script>
/* =====================================================================
   1. PERSISTANCE
   ===================================================================== */
const KEY='coach-chinois-v2';
let memoryOnly=false;
function loadState(){
  const base={items:{},written:[],lessons:{},streak:{n:0,last:''},lastLesson:'',
    settings:{level:2,theme:'all',provider:'none',apikey:'',rate:.85,font:'sans',
      pause:.7,sfx:true,auto:false,voices:{d:'',A:'',B:'',C:''}}};
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return base;
    const p=JSON.parse(raw);
    return Object.assign(base,p,{settings:Object.assign(base.settings,p.settings||{})});
  }catch(e){memoryOnly=true;return base;}
}
function save(){
  if(memoryOnly)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memoryOnly=true;}
}
let S=loadState();

/* =====================================================================
   2. CONTENU
   Chaque élément porte un niveau HSK et un ou plusieurs thèmes.
   Le pinyin est écrit syllabe par syllabe pour colorer chaque ton.
   ===================================================================== */
const THEMES=[
  {id:'presenter',      n:'Se présenter'},
  {id:'decrire',        n:'Présenter et décrire quelqu\u2019un'},
  {id:'famille',        n:'La famille'},
  {id:'quotidien',      n:'Loisirs, habitudes, quotidien'},
  {id:'nourriture',     n:'La nourriture et le restaurant'},
  {id:'achats',         n:'Faire des achats'},
  {id:'temps',          n:'Se repérer dans le temps'},
  {id:'passe',          n:'Raconter au passé'},
  {id:'espace',         n:'Se repérer dans l\u2019espace'},
  {id:'logement',       n:'Le logement'},
  {id:'travail',        n:'Le travail et les études'},
  {id:'voyage',         n:'Le voyage'},
  {id:'sante',          n:'La santé'},
  {id:'projets',        n:'Parler de ses projets'},
  {id:'avis',           n:'Donner son avis, comparer'}
];

const WORDS=[
  // ---- HSK 2 · se présenter
  {id:'w201',hz:'名字',py:'míng zi',fr:'prénom, nom',hsk:2,th:['presenter']},
  {id:'w202',hz:'叫',py:'jiào',fr:'s\u2019appeler',hsk:2,th:['presenter']},
  {id:'w203',hz:'姓',py:'xìng',fr:'nom de famille ; s\u2019appeler (de famille)',hsk:2,th:['presenter']},
  {id:'w204',hz:'认识',py:'rèn shi',fr:'connaître, faire la connaissance de',hsk:2,th:['presenter','decrire']},
  {id:'w205',hz:'高兴',py:'gāo xìng',fr:'content, heureux',hsk:2,th:['presenter']},
  {id:'w206',hz:'岁',py:'suì',fr:'an(s) — âge',hsk:2,th:['presenter']},
  {id:'w207',hz:'住',py:'zhù',fr:'habiter',hsk:2,th:['presenter','logement']},
  {id:'w208',hz:'工作',py:'gōng zuò',fr:'travail ; travailler',hsk:2,th:['presenter','travail']},
  {id:'w209',hz:'学生',py:'xué sheng',fr:'élève, étudiant',hsk:2,th:['presenter','travail']},
  {id:'w210',hz:'老师',py:'lǎo shī',fr:'professeur',hsk:2,th:['presenter','travail']},
  {id:'w211',hz:'医生',py:'yī shēng',fr:'médecin',hsk:2,th:['presenter','travail','sante']},
  {id:'w212',hz:'朋友',py:'péng you',fr:'ami',hsk:2,th:['presenter','famille']},
  {id:'w213',hz:'中国',py:'Zhōng guó',fr:'la Chine',hsk:2,th:['presenter']},
  {id:'w214',hz:'汉语',py:'Hàn yǔ',fr:'le chinois (langue)',hsk:2,th:['presenter']},
  {id:'w215',hz:'哪',py:'nǎ',fr:'quel, lequel',hsk:2,th:['presenter']},
  {id:'w216',hz:'多大',py:'duō dà',fr:'quel âge',hsk:2,th:['presenter']},
  {id:'w217',hz:'会',py:'huì',fr:'savoir (faire), pouvoir',hsk:2,th:['presenter']},
  {id:'w218',hz:'说',py:'shuō',fr:'dire, parler',hsk:2,th:['presenter']},

  // ---- HSK 3 · se présenter
  {id:'w301',hz:'介绍',py:'jiè shào',fr:'présenter (quelqu\u2019un)',hsk:3,th:['presenter','decrire']},
  {id:'w302',hz:'自己',py:'zì jǐ',fr:'soi-même',hsk:3,th:['presenter']},

/* =====================================================================
   3. OUTILS
   ===================================================================== */
const TONES={'āēīōūǖ':1,'áéíóúǘ':2,'ǎěǐǒǔǚ':3,'àèìòùǜ':4};
function toneOf(syl){
  for(const c of syl.toLowerCase())
    for(const k in TONES) if(k.includes(c)) return TONES[k];
  return 0;
}
function pinyin(py){
  return py.split(/(\s+|[,，.。?？!！])/).map(p=>{
    if(!p.trim()||/^[,，.。?？!！]$/.test(p))return esc(p);
    return `<span class="s${toneOf(p)}">${esc(p)}</span>`;
  }).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div');d.className='toast';d.textContent=m;
  document.body.appendChild(d);setTimeout(()=>d.remove(),3400);
}

/* --- Polices chinoises --- */
const FONTS={
  sans:{n:'Sans — heiti',ex:'La plus lisible sur écran',v:"'Noto Sans SC',sans-serif"},
  serif:{n:'Serif — songti',ex:'Celle des livres imprimés',v:"'Noto Serif SC',serif"},
  xiaowei:{n:'Élégante — XiaoWei',ex:'Traits fins, allure calligraphique',v:"'ZCOOL XiaoWei',serif"},

       v:"'Kaiti SC','STKaiti','KaiTi','TW-Kai','Noto Serif SC',serif"}
};
function applyFont(){
  const f=FONTS[S.settings.font]||FONTS.sans;
  if(document.documentElement&&document.documentElement.style)
    document.documentElement.style.setProperty('--han',f.v);
}

/* --- Effets sonores --- */
let AC=null;
function beep(kind){
  if(!S.settings.sfx)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    AC=AC||new Ctx();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const seq=kind==='ok'?[[587,0,.10],[880,.10,.26]]:[[311,0,.13],[233,.13,.30]];
    seq.forEach(([f,s,e])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+s);
      g.gain.exponentialRampToValueAtTime(.14,t+s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+e);
      o.connect(g);g.connect(AC.destination);
      o.start(t+s);o.stop(t+e+.03);
    });
  }catch(e){}
}

/* --- Série de jours --- */
function touchStreak(){
  const d=new Date().toDateString();
  if(S.streak.last===d)return;
  const y=new Date(Date.now()-864e5).toDateString();
  S.streak.n=(S.streak.last===y)?S.streak.n+1:1;
  S.streak.last=d;save();
}

/* --- Répétition espacée (Leitner) --- */
const BOXES=[0,1,3,7,21,60];
function rec(id){if(!S.items[id])S.items[id]={box:0,due:0,seen:0,ok:0,ko:0};return S.items[id];}
function boxOf(id){return (S.items[id]||{box:0}).box;}
function due(id){const r=S.items[id];return !r||r.due<=Date.now();}
function grade(id,g){
  const r=rec(id);r.seen++;
  if(g===0){r.box=0;r.ko++;}
  else if(g===1){r.box=Math.max(0,r.box-1);r.ko++;}
  else{r.box=Math.min(BOXES.length-1,r.box+1);r.ok++;}
  r.due=Date.now()+BOXES[r.box]*864e5;
  touchStreak();save();
}
function mastered(id){const r=S.items[id];return !!r&&r.box>=4;}

/* --- Filtres --- */
function fits(o){
  if(o.hsk!==S.settings.level)return false;
  const T=S.settings.theme;
  if(T!=='all'&&!(o.th||[]).includes(T))return false;
  return true;
}
function pool(){return WORDS.filter(fits);}
function themeName(id){const t=THEMES.find(x=>x.id===id);return t?t.n:'';}
function lessonProgress(l){return (S.lessons[l.id]||[]).length;}
/* Parcours mis en avant sur l’accueil : le dernier ouvert s’il est en cours,
   sinon le premier commencé mais non terminé, sinon le premier non entamé. */
function currentLesson(){
  const lp=LESSONS.filter(l=>l.hsk===S.settings.level);
  if(!lp.length)return null;
  const running=lp.filter(l=>{const p=lessonProgress(l);return p>0&&p<l.steps.length;});
  if(running.length){
    const last=running.find(l=>l.id===S.lastLesson);
    return last||running[0];
  }
  return lp.find(l=>lessonProgress(l)===0)||lp[lp.length-1];
}

/* --- Voix : sélection, locuteurs, pauses --- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if(typeof speechSynthesis!=='undefined'&&speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function zhVoices(){return voices.filter(v=>/^zh/i.test(v.lang));}
function zhVoice(){return zhVoices()[0];}
function byName(n){return voices.find(v=>v.name===n);}
const PITCH={A:1,B:.72,C:1.28};
function voiceFor(who){
  const st=S.settings.voices||{};
  const dedicated=who&&st[who]?byName(st[who]):null;
  const v=dedicated||byName(st.d)||zhVoice();
  return {v:v,pitch:dedicated?1:(who?(PITCH[who]||1):1)};
}
let seqToken=0;
function stopSpeech(){seqToken++;try{speechSynthesis.cancel();}catch(e){}}
function canSpeak(){
  if(typeof speechSynthesis==='undefined'||!speechSynthesis){toast('Synthèse vocale indisponible.');return false;}
  if(!zhVoice()){toast('Aucune voix chinoise sur cet appareil. Ajoutez le pack de langue chinois dans les réglages du système.');return false;}
  return true;
}
function speak(txt,who){
  if(!canSpeak())return;
  stopSpeech();
  const {v,pitch}=voiceFor(who);
  const u=new SpeechSynthesisUtterance(txt);
  u.voice=v;u.lang=v.lang;u.rate=S.settings.rate;u.pitch=pitch;
  speechSynthesis.speak(u);
}
function speakSeq(items){
  if(!canSpeak())return;
  stopSpeech();
  const my=++seqToken;
  let i=0;
  const next=()=>{
    if(my!==seqToken||i>=items.length)return;
    const it=items[i++];
    const {v,pitch}=voiceFor(it.who);
    const u=new SpeechSynthesisUtterance(it.hz);
    u.voice=v;u.lang=v.lang;u.rate=S.settings.rate;u.pitch=pitch;
    u.onend=()=>{if(my===seqToken)setTimeout(next,(S.settings.pause||0)*1000);};
    u.onerror=()=>{};
    speechSynthesis.speak(u);
  };
  next();
}

/* --- Correction assistée (facultative) --- */
async function correct(text,consigne){
  const p=S.settings.provider,k=S.settings.apikey;
  if(p==='none'||!k)throw new Error('aucune clé');
  const prompt=`Tu es professeur de chinois pour une apprenante francophone de niveau HSK${S.settings.level}.
Consigne : ${consigne}
Texte de l’apprenante :
${text}

Réponds en français, brièvement :
1. Version corrigée en chinois, avec pinyin.
2. Les erreurs, une par ligne : écrit → attendu, puis la règle en une phrase.
3. Une reformulation plus naturelle si elle existe.
Pas de préambule ni de conclusion.`;
  if(p==='anthropic'){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
    if(!r.ok)throw new Error('erreur '+r.status);
    const d=await r.json();
    return d.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
  }
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(k),
    {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  if(!r.ok)throw new Error('erreur '+r.status);
  const d=await r.json();
  return ((d.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('\n');
}

function levelPills(){
  const n=l=>WORDS.filter(w=>w.hsk===l).length+TEXTS.filter(t=>t.hsk===l).length+GRAMMAR.filter(g=>g.hsk===l).length;

    `<button class="pill ${S.settings.level===l?'on':''} ${n(l)?'':'void'}" onclick="setLevel(${l})">HSK ${l}</button>`).join('')}</div>`;

function themeSelect(){

  </select></div>`;
}
function setLevel(l){S.settings.level=l;save();ctx={};render();}
function setTheme(t){S.settings.theme=t;save();ctx={};render();}
function nothing(){
  return `<div class="void"><span class="em">空</span>
    <p><b>Rien à ce filtre</b></p>
    <p class="sm">Le contenu couvre pour l’instant « Se présenter » et « Présenter et décrire quelqu’un », en HSK 2 et HSK 3. Changez de niveau ou de thème.</p></div>`;

function ribbon(){
  if(!ctx.from)return '';
  const l=LESSONS.find(x=>x.id===ctx.from.l);if(!l)return '';

    <span>Étape ${ctx.from.i+1} sur ${l.steps.length}</span>
    <button onclick="finishStep()">Terminé</button></div>`;

}

  const el=document.getElementById('tian');if(!el)return;

  if(typeof HanziWriter==='undefined'){

    beep(good?'ok':'no');

    toast(good?'Tracé juste, sans erreur !':d.totalMistakes+' erreur(s) de tracé.');
    W.showCharacter();render();
  }});

  }).join('')}</div>

function pick(key,j,ok,nextKey){
  ctx.ans=ctx.ans||{};

  ctx.ans[key]=j;

/* ---------- Compréhension ---------- */
function vCO(){return comp('CO','Compréhension orale','Écoutez d’abord, le texte reste caché');}
function vCE(){return comp('CE','Compréhension écrite','Lisez, puis répondez');}
function comp(mode,titre,sub){
  const P=TEXTS.filter(t=>fits(t)&&t.mode===mode);
  if(!P.length)return header(titre)+levelPills()+nothing();
  ctx.t=ctx.t||P[0].id;
  const t=P.find(x=>x.id===ctx.t)||P[0];
  const masked=(mode==='CO'&&!ctx.hz);
  const dialogue=t.lines.some(l=>l.who);
  const seq=JSON.stringify(t.lines.map(l=>({hz:l.hz,who:l.who||null}))).replace(/'/g,'&#39;');
  return header(titre,sub)+ribbon()+`
  <div class="box">
    <p><b>${esc(t.title)}</b> <span class="mut sm">${esc(t.fr)}</span></p>
    <button class="btn jade" onclick='speakSeq(${seq})'>Écouter en entier</button>
    <button class="btn pale sm mt" onclick="stopSpeech()">Arrêter</button>
    ${dialogue?`<p class="mut sm mt">Chaque locuteur a sa voix, avec une pause entre les répliques. Réglable dans Réglages.</p>`:''}
    <div class="row mt">
      <button class="btn pale sm" onclick="ctx.py=!ctx.py;render()">${ctx.py?'Cacher':'Voir'} pinyin</button>
      <button class="btn pale sm" onclick="ctx.fr=!ctx.fr;render()">${ctx.fr?'Cacher':'Voir'} traduction</button>
      ${mode==='CO'?`<button class="btn pale sm" onclick="ctx.hz=!ctx.hz;render()">${ctx.hz?'Cacher':'Voir'} texte</button>`:''}
    </div>
  </div>

    onclick="ctx.p='${x.id}';ctx.built=[];ctx.res=null;ctx.aiout=null;render()">${i+1}. ${lbl[x.type]}</button>`).join('')}</div>
  ${p.type==='ordre'?pOrdre(p):p.type==='trad'?pTrad(p):pLibre(p)}

    </div>`).join('')}`:''}`;
}
const shuffled={};
function bagOf(p,built){
  const used=(built||[]).slice(),rest=[];
  p.words.forEach(w=>{const k=used.indexOf(w);if(k>=0)used.splice(k,1);else rest.push(w);});
  if(!shuffled[p.id])shuffled[p.id]=shuffle(p.words);
  const bag=[],tmp=rest.slice();
  shuffled[p.id].forEach(w=>{const k=tmp.indexOf(w);if(k>=0){bag.push(w);tmp.splice(k,1);}});
  tmp.forEach(w=>bag.push(w));
  return bag;
}
function pOrdre(p){
  ctx.built=ctx.built||[];
  const bag=bagOf(p,ctx.built);
  const done=ctx.built.join('')===p.ok;
  if(!bag.length&&!ctx.rang){ctx.rang=1;beep(done?'ok':'no');}
  if(bag.length)ctx.rang=0;
  return `<div class="box">
    <p><b>${esc(p.consigne)}</b></p>
    <p class="mut sm">${esc(p.fr)}</p>
    <div class="drop">${ctx.built.map((w,i)=>`<button class="tile" onclick="unbuild(${i})">${esc(w)}</button>`).join('')
      ||'<span class="mut sm" style="padding:0 6px">Touchez les mots dans l’ordre</span>'}</div>
    <div class="tiles mt">${bag.map((w,i)=>`<button class="tile" onclick="build(${i},'${jq(p.id)}')">${esc(w)}</button>`).join('')}</div>
    ${!bag.length?`<div class="verdict ${done?'ok':'no'} mt">${done?'Phrase juste !':'Ordre incorrect. Réponse : '+esc(p.ok)}</div>
      ${done?`<button class="btn jade mt" onclick="speakSeq([{hz:'${jq(p.ok)}'}])">Écouter la phrase</button>`:''}`:''}
    <button class="btn pale mt" onclick="ctx.built=[];ctx.rang=0;render()">Recommencer</button>
  </div>`;
}
function build(i,pid){
  const p=PROD.find(x=>x.id===pid);
  const bag=bagOf(p,ctx.built);
  ctx.built=(ctx.built||[]).concat(bag[i]);
  if(ctx.built.length===p.words.length)touchStreak();
  render();
}
function unbuild(i){ctx.built.splice(i,1);ctx.rang=0;render();}
function pTrad(p){
  return `<div class="box">
    <p><b>${esc(p.consigne)}</b></p>

    <textarea id="ta" rows="3" placeholder="Écrivez en chinois…">${esc(ctx.txt||'')}</textarea>

    ${ctx.aiout?`<div class="verdict ok mt" style="white-space:pre-wrap">${esc(ctx.aiout)}</div>`:''}

}
function pLibre(p){
  return `<div class="box">

    ${ctx.res==='m'&&p.modele?`<div class="verdict ok mt"><div class="sentence" style="font-size:19px">${esc(p.modele)}</div></div>
      <button class="btn pale sm" onclick="speakSeq([{hz:'${jq(p.modele||'')}'}])">Écouter le modèle</button>`:''}

function keepTxt(){const t=document.getElementById('ta');if(t)ctx.txt=t.value;}
function keep(pid){

async function askAI(pid){
  keepTxt();
  if(!ctx.txt||!ctx.txt.trim())return toast('Écrivez d’abord quelque chose.');
  if(S.settings.provider==='none'||!S.settings.apikey)

/* =====================================================================
   6. EXERCICES QUESTION PAR QUESTION (mots du texte, bilan noté)
   ===================================================================== */
function vocabQuestions(words,n){
  if(!words.length)return [];
  const ranked=words.slice().sort((a,b)=>boxOf(a.id)-boxOf(b.id));
  const picked=shuffle(ranked.slice(0,Math.min(words.length,Math.max(n,Math.ceil(n*1.6))))).slice(0,Math.min(n,words.length));
  return picked.map((w,k)=>{
    const others=shuffle(words.filter(x=>x.id!==w.id)).slice(0,3);
    const toHz=(k%2===1)&&others.length===3;
    const good=toHz?w.hz:w.fr;
    const a=shuffle([good].concat(others.map(o=>toHz?o.hz:o.fr)));
    return {kind:'vocab',wid:w.id,audio:w.hz,
      prompt:toHz?w.fr:w.hz,promptHan:!toHz,
      hint:toHz?null:null,
      a:a,ok:a.indexOf(good),han:toHz,
      why:`${w.hz} — ${w.py} — ${w.fr}`};
  });
}
function lessonQuiz(l,mode){
  const words=WORDS.filter(w=>w.hsk===l.hsk&&w.th.includes(l.theme));
  if(mode==='mots')return vocabQuestions(words,Math.min(8,words.length));
  const qs=vocabQuestions(words,4);
  const g=GRAMMAR.find(x=>l.steps.some(s=>s.k==='gram'&&s.ref===x.id));
  if(g)shuffle(g.qcm).slice(0,2).forEach(q=>qs.push({kind:'gram',prompt:q.q,promptHan:false,a:q.a,ok:q.ok,han:false,why:q.why}));
  const t=TEXTS.find(x=>l.steps.some(s=>s.k==='text'&&s.ref===x.id));
  if(t)shuffle(t.qcm).slice(0,2).forEach(q=>qs.push({kind:'texte',prompt:q.q,promptHan:true,a:q.a,ok:q.ok,han:true,
    audio:t.lines.map(x=>x.hz).join(''),why:null}));
  return shuffle(qs);
}
function startQuiz(lid,mode,stepIndex){
  const l=LESSONS.find(x=>x.id===lid);
  const qs=lessonQuiz(l,mode);
  if(!qs.length){toast('Pas assez de contenu pour cet exercice à ce niveau.');return;}
  go(mode,{quiz:{lid:lid,mode:mode,qs:qs,i:0,ans:[]},from:{l:lid,i:stepIndex}});
}
function qAnswer(j){
  const Q=ctx.quiz,q=Q.qs[Q.i];
  if(Q.ans[Q.i]!=null)return;
  const good=j===q.ok;
  Q.ans[Q.i]=j;
  beep(good?'ok':'no');
  if(q.kind==='vocab'&&q.wid)grade(q.wid,good?2:0);
  touchStreak();save();
  render();
  if(S.settings.auto)setTimeout(()=>{if(ctx.quiz===Q&&Q.ans[Q.i]!=null)qNext();},1300);
}
function qNext(){
  const Q=ctx.quiz;
  if(Q.i<Q.qs.length-1){Q.i++;render();scrollTo(0,0);}
  else{Q.done=true;render();scrollTo(0,0);}
}
function qRestart(){
  const Q=ctx.quiz;
  const l=LESSONS.find(x=>x.id===Q.lid);
  ctx.quiz={lid:Q.lid,mode:Q.mode,qs:lessonQuiz(l,Q.mode),i:0,ans:[]};
  render();scrollTo(0,0);
}
function vQuiz(){
  const Q=ctx.quiz;
  if(!Q)return vParcours();
  const l=LESSONS.find(x=>x.id===Q.lid);
  const titre=Q.mode==='mots'?'Les mots du texte':'Bilan noté';
  const right=Q.ans.filter((a,k)=>a===Q.qs[k].ok).length;

  if(Q.done){
    const total=Q.qs.length,pct=Math.round(right/total*100);
    const seuil=Q.mode==='bilan'?Math.ceil(total*.75):Math.ceil(total*.6);
    const pass=right>=seuil;
    const faibles=Q.qs.map((q,k)=>[q,Q.ans[k]]).filter(([q,a])=>a!==q.ok);
    const parType=k=>faibles.filter(([q])=>q.kind===k).length;
    return header(titre,l.title)+`
    <div class="box">
      <div class="score"><div class="n">${right}<small> / ${total}</small></div>
        <div class="lbl">${pct}% de réponses justes</div></div>
      <div class="bar" style="margin:14px 0"><i style="width:${pct}%;background:${pass?'var(--jade)':'var(--red)'}"></i></div>
      <div class="verdict ${pass?'ok':'no'}">${pass
        ?(Q.mode==='bilan'?'Bilan réussi. Le thème est validé à ce niveau.':'Bien joué, les mots sont en place.')
        :`Il faut ${seuil} bonnes réponses sur ${total} pour valider. Reprenez et recommencez.`}</div>
      ${faibles.length?`<p class="mut sm">À revoir : ${[
        parType('vocab')?parType('vocab')+' sur le vocabulaire':'',
        parType('gram')?parType('gram')+' sur la grammaire':'',
        parType('texte')?parType('texte')+' sur la compréhension':''
      ].filter(Boolean).join(', ')}.</p>`:''}
    </div>
    ${faibles.length?`<h2 class="sec">Les erreurs</h2>
      ${faibles.map(([q,a])=>`<div class="box">
        <p class="${q.promptHan?'hz':''}" style="${q.promptHan?'font-size:21px;font-weight:700;':''}margin:0 0 6px">${esc(q.prompt)}</p>
        <p class="sm" style="margin:0"><span style="color:var(--red)">Votre réponse : ${esc(q.a[a])}</span></p>
        <p class="sm" style="margin:2px 0 0;color:var(--jade-d)">Attendu : ${esc(q.a[q.ok])}</p>
        ${q.why?`<p class="mut sm" style="margin:6px 0 0">${esc(q.why)}</p>`:''}
      </div>`).join('')}`:''}
    <button class="btn pale" onclick="qRestart()">Recommencer l’exercice</button>
    ${pass?`<button class="btn mt" onclick="finishStep()">Valider l’étape</button>`
          :`<button class="btn pale mt" onclick="back()">Revenir au parcours</button>`}`;
  }

  const q=Q.qs[Q.i],a=Q.ans[Q.i];
  const label={vocab:'Vocabulaire',gram:'Grammaire',texte:'Compréhension'}[q.kind];
  return header(titre,l.title)+`
  <div class="qnum">Question ${Q.i+1} sur ${Q.qs.length} · ${label}</div>
  <div class="qprog">${Q.qs.map((x,k)=>{
    const cl=k===Q.i?'now':(Q.ans[k]==null?'':(Q.ans[k]===x.ok?'ok':'no'));
    return `<i class="${cl}"></i>`;}).join('')}</div>
  <div class="box">
    <div class="prompt">
      <div class="${q.promptHan?'big':'med'}">${esc(q.prompt)}</div>
    </div>
    ${q.audio?`<button class="btn pale sm" onclick="speak('${jq(q.audio)}')">Écouter</button>`:''}
    <div class="opts">${q.a.map((opt,j)=>{
      let cl='';if(a!=null)cl=(j===q.ok)?'ok':(j===a?'no':'');
      return `<button class="opt ${q.han?'han':''} ${cl}" onclick="qAnswer(${j})">${esc(opt)}</button>`;
    }).join('')}</div>
    ${a!=null?`<div class="verdict ${a===q.ok?'ok':'no'}">${a===q.ok?'Juste.':'Réponse attendue : '+esc(q.a[q.ok])+'.'}${q.why?' '+esc(q.why):''}</div>
      <button class="btn" onclick="qNext()">${Q.i<Q.qs.length-1?'Suivant':'Voir le résultat'}</button>`:''}
  </div>`;
}

function openLesson(id){S.lastLesson=id;save();go('lecon',{l:id});}
function vLecon(){
  const l=LESSONS.find(x=>x.id===ctx.l);
  if(!l)return vParcours();
  const done=S.lessons[l.id]||[];
  const words=WORDS.filter(w=>w.hsk===l.hsk&&w.th.includes(l.theme));
  const m=words.filter(w=>mastered(w.id)).length;

    return `<button class="pstep ${isDone?'done':open?'open':''}"

  }).join('');
  return header(l.title,l.intro)+`
  <div class="box">
    <div class="bar"><i style="width:${done.length/l.steps.length*100}%;background:var(--red)"></i></div>
    <p class="mut sm" style="margin:10px 0 0">${done.length} / ${l.steps.length} étapes · ${m} mot${m>1?'s':''} acquis sur ${words.length}</p>
  </div>

  ${done.length===l.steps.length?`<div class="box" style="text-align:center">
    <p class="hz" style="font-size:42px;margin:0;color:var(--red);font-weight:700">成</p>
    <p><b>Thème terminé</b></p>
    <p class="mut sm">Passez au niveau supérieur pour reprendre le même thème avec plus de moyens.</p></div>`:''}`;
}
function openStep(lid,i){
  const l=LESSONS.find(x=>x.id===lid),s=l.steps[i];
  const from={l:lid,i:i};
  if(s.k==='mots')return startQuiz(lid,'mots',i);
  if(s.k==='bilan')return startQuiz(lid,'bilan',i);
  if(s.k==='gram')return go('gram',{g:s.ref,from:from});
  if(s.k==='prod')return go('prod',{p:s.ref,from:from});
  const t=TEXTS.find(x=>x.id===s.ref);
  return go(t.mode==='CO'?'co':'ce',{t:s.ref,from:from});
}

      <span class="bar" style="flex:1"><i style="width:${n/maxb*100}%;background:${b>=4?'var(--jade)':b>=2?'var(--gold)':'var(--red)'}"></i></span>
      <span class="sm" style="width:24px;text-align:right">${n}</span></div>`).join('')}
    <p class="mut sm" style="margin:10px 0 0">Un mot monte d’une boîte à chaque réussite. Boîte 4 ou 5 = acquis. Un échec le renvoie en boîte 0. Les mots des boîtes basses sortent en priorité dans les exercices des parcours.</p>
  </div>
  <h2 class="sec">Parcours</h2>
  <div class="box">
    <div class="bar"><i style="width:${pcent}%;background:var(--red)"></i></div>
    <p class="mut sm" style="margin:10px 0 0">${stepsDone} étape${stepsDone>1?'s':''} validée${stepsDone>1?'s':''} sur ${stepsAll}, tous parcours et tous niveaux confondus — ${pcent} %.</p>
  </div>
  ${LESSONS.map(l=>{const p=(S.lessons[l.id]||[]).length;
    return `<div class="wrow"><span class="g" style="font-family:var(--ui);font-size:19px;color:var(--red)">${p>=l.steps.length?'成':'路'}</span>
    <span class="m"><b>${esc(l.title)}</b><span class="mut">${p} / ${l.steps.length} étapes</span>
    <span class="bar" style="margin-top:6px"><i style="width:${p/l.steps.length*100}%;background:var(--red)"></i></span></span></div>`;}).join('')}`;
}

/* ---------- Réglages ---------- */
function voiceSelect(key,label){
  const vs=zhVoices();
  const cur=(S.settings.voices||{})[key]||'';
  return `<div class="vsel"><span class="who">${esc(label)}</span>
    <div class="selwrap"><select onchange="setVoice('${key}',this.value)">
      <option value="">${key==='d'?'Première voix disponible':'Voix par défaut, hauteur décalée'}</option>
      ${vs.map(v=>`<option value="${esc(v.name)}" ${cur===v.name?'selected':''}>${esc(v.name)} — ${esc(v.lang)}</option>`).join('')}
    </select></div></div>`;
}
function setVoice(k,v){S.settings.voices=S.settings.voices||{};S.settings.voices[k]=v;save();render();}
function toggle(k){S.settings[k]=!S.settings[k];save();render();}
function sw(k,label,help){
  return `<div class="sw ${S.settings[k]?'on':''}" onclick="toggle('${k}')" role="button">
    <span class="lb">${esc(label)}${help?`<br><span class="mut sm">${esc(help)}</span>`:''}</span>
    <span class="kn"></span></div>`;
}
function vReglages(){
  const vs=zhVoices();
  return `<div class="top"><div class="htitle">Réglages<small>Police, voix, sons, correction, sauvegarde</small></div></div>
  <h2 class="sec">Police des caractères chinois</h2>
  ${Object.keys(FONTS).map(k=>`<button class="wrow" style="width:100%;text-align:left;${S.settings.font===k?'border-color:var(--red)':''}"
    onclick="S.settings.font='${k}';save();render()">
    <span class="g" style="font-family:${FONTS[k].v.replace(/"/g,'&quot;')};font-size:27px">汉字</span>
    <span class="m"><b style="${S.settings.font===k?'color:var(--red)':''}">${esc(FONTS[k].n)}</b><span class="mut">${esc(FONTS[k].ex)}</span></span>
    ${S.settings.font===k?'<span class="seal">选</span>':''}
  </button>`).join('')}

  <h2 class="sec">Voix</h2>
  <div class="box">
    ${vs.length?`<p class="mut sm">${vs.length} voix chinoise${vs.length>1?'s':''} détectée${vs.length>1?'s':''} sur cet appareil.</p>
    ${voiceSelect('d','Par défaut')}
    ${voiceSelect('A','Locuteur A')}
    ${voiceSelect('B','Locuteur B')}
    ${voiceSelect('C','Locuteur C')}
    <p class="mut sm">Si vous n’avez qu’une seule voix, laissez « voix par défaut » sur les locuteurs : la hauteur sera décalée pour les distinguer.</p>`
    :`<p class="sm"><b>Aucune voix chinoise détectée.</b> Ajoutez le pack de langue chinois dans les réglages de votre téléphone, puis rouvrez cette page.</p>`}
    <p class="mut sm mt">Vitesse — ${S.settings.rate.toFixed(2)}×</p>
    <input type="range" min="0.5" max="1.2" step="0.05" value="${S.settings.rate}"
      oninput="S.settings.rate=parseFloat(this.value);save();render()">
    <p class="mut sm">Pause entre les répliques — ${S.settings.pause.toFixed(1)} s</p>
    <input type="range" min="0" max="2.5" step="0.1" value="${S.settings.pause}"
      oninput="S.settings.pause=parseFloat(this.value);save();render()">
    <button class="btn jade mt" onclick="speakSeq([{hz:'你好，我叫张明。',who:'A'},{hz:'你好，认识你很高兴。',who:'B'},{hz:'我也很高兴。',who:'C'}])">Tester un dialogue à trois voix</button>
    <button class="btn pale sm mt" onclick="stopSpeech()">Arrêter</button>
  </div>

  <h2 class="sec">Sons et rythme</h2>
  <div class="box">
    ${sw('sfx','Effets sonores','Un son court à chaque réponse juste ou fausse')}
    ${sw('auto','Passage automatique','Enchaîne la question suivante sans toucher « Suivant »')}
  </div>

  <h2 class="sec">Correction des écrits</h2>
  <div class="box">
    <p class="mut sm">L’application fonctionne entièrement sans clé. Une clé ajoute la correction des phrases libres. Elle reste dans ce navigateur.</p>
    <div class="selwrap"><select onchange="S.settings.provider=this.value;save();render()">
      <option value="none" ${S.settings.provider==='none'?'selected':''}>Aucune — modèle seul</option>
      <option value="gemini" ${S.settings.provider==='gemini'?'selected':''}>Google Gemini — gratuit</option>
      <option value="anthropic" ${S.settings.provider==='anthropic'?'selected':''}>Anthropic — payant à l’usage</option>
    </select></div>
    ${S.settings.provider!=='none'?`
      <input type="password" placeholder="Collez la clé ici" value="${esc(S.settings.apikey)}"
        onchange="S.settings.apikey=this.value;save();toast('Clé enregistrée sur cet appareil.')" style="margin-top:10px">
      <p class="mut sm">${S.settings.provider==='gemini'
        ?'Clé gratuite via Google AI Studio. Sur le palier gratuit, les données envoyées peuvent servir à entraîner le modèle.'
        :'Clé via la console Anthropic. Facturation à la consommation, indépendante de l’abonnement Claude.'}</p>`:''}
  </div>

  <h2 class="sec">Ma progression</h2>
  <div class="box">
    <button class="btn pale" onclick="exportJSON()">Exporter dans un fichier</button>
    <button class="btn pale mt" onclick="document.getElementById('imp').click()">Importer un fichier</button>
    <button class="btn pale mt" style="color:var(--red)" onclick="wipe()">Tout effacer</button>
    <input type="file" id="imp" accept="application/json" class="hidden" onchange="importJSON(this)">
    <p class="mut sm mt">Exportez avant de changer d’appareil : la progression est stockée dans ce navigateur uniquement.</p>
  </div>`;
}
function exportJSON(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='coach-chinois-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render();toast('Progression importée.');}
    catch(e){toast('Fichier illisible.');}};
  r.readAsText(f);
}
function wipe(){
  if(!confirm('Effacer toute la progression ? Cette action est définitive.'))return;
  S.items={};S.written=[];S.lessons={};S.streak={n:0,last:''};save();render();toast('Progression effacée.');
}

render();
</script>
</body>
</html>
