const TONES={'āēīōūǖ':1,'áéíóúǘ':2,'ǎěǐǒǔǚ':3,'àèìòùǜ':4};
function toneOf(syl){
  for(const c of syl.toLowerCase())
    for(const k in TONES) if(k.includes(c)) return TONES[k];
  return 0;
}
function pinyin(py){
  return py.split(/(\s+|[,，.。?？!！])/).map(p=>{
    if(!p.trim()||/^[,，.。?？!！]$/.test(p))return esc(p);
    return `<span class="s${toneOf(p)}">${esc(p)}</span>`;
  }).join('');
}
const VOW={a:'aāáǎà',e:'eēéěè',i:'iīíǐì',o:'oōóǒò',u:'uūúǔù','ü':'üǖǘǚǜ'};
function stripTone(sy){
  let r='';
  for(const c of sy){
    let hit=false;
    for(const k in VOW){const i=VOW[k].indexOf(c);if(i>=0){r+=(c===c.toUpperCase()&&c!==k?k.toUpperCase():k);hit=true;break;}}
    if(!hit)r+=c;
  }
  return r;
}
/* Repose une marque de ton sur la voyelle réglementaire : a et e priment,
   dans « ou » c’est le o, sinon c’est la dernière voyelle. */
function setTone(sy,n){
  const base=stripTone(sy),low=base.toLowerCase();
  if(n===0)return base;
  let pos=-1;
  if(low.includes('a'))pos=low.indexOf('a');
  else if(low.includes('e'))pos=low.indexOf('e');
  else if(low.includes('ou'))pos=low.indexOf('o');
  else for(let i=low.length-1;i>=0;i--){if('aeiouü'.includes(low[i])){pos=i;break;}}
  if(pos<0)return base;
  return base.slice(0,pos)+VOW[low[pos]][n]+base.slice(pos+1);
}
function tonVariants(py){
  const parts=py.split(' '),out=[py];
  let guard=0;
  while(out.length<4&&guard++<80){
    const i=Math.random()*parts.length|0,cur=toneOf(parts[i]),n=Math.random()*5|0;
    if(n===cur)continue;
    const c=parts.slice();c[i]=setTone(parts[i],n);
    const v=c.join(' ');
    if(!out.includes(v))out.push(v);
  }
  return out;
}
function normZh(t){return String(t||'').replace(/[\s，。？！、,.?!；;：:’'"“”（）()]/g,'');}
function diffZh(given,expect){
  const A=normZh(given),B=normZh(expect);
  let h=0;while(h<A.length&&h<B.length&&A[h]===B[h])h++;
  let t=0;while(t<A.length-h&&t<B.length-h&&A[A.length-1-t]===B[B.length-1-t])t++;
  const mark=x=>esc(x.slice(0,h))+(x.length-t>h?'<u>'+esc(x.slice(h,x.length-t))+'</u>':'')+esc(x.slice(x.length-t));
  return {you:mark(A),exp:mark(B)};
}

const HAN_RE=/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;
const PY_PONCT=/[\s,，.。、·？?！!;；:：""“”‘’'`()（）《》「」…—–\-]+/;

function hanChars(s){return Array.from(String(s||'')).filter(c=>HAN_RE.test(c));}
function pySyls(py){return String(py||'').split(PY_PONCT).map(t=>t.trim()).filter(Boolean);}
/* Forme nue d’une syllabe : minuscules, v noté ü, marques de ton retirées. */
function pyBare(s){return stripTone(String(s||'').toLowerCase()).replace(/v/g,'ü');}
/* Clé de lecture : la syllabe nue suivie de son ton, insensible à la
   place exacte de la marque. */
function pyRead(s){return pyBare(s)+toneOf(s);}

function pinyinCheck(hz,py,skipDict){
  const han=hanChars(hz),toks=pySyls(py);
  if(!han.length)return{ok:true,code:'',why:'',paires:[],doute:[]};
  if(!toks.length)return{ok:false,code:'vide',why:'Pinyin absent.',paires:[],doute:[]};
  const syls=[];
  for(const t of toks){
    /* Nom propre laissé en alphabet latin : il figure tel quel dans la
       chaîne de caractères et ne consomme aucune syllabe. */
    if(/^[A-Za-zÀ-ÿ'’-]+$/.test(t)&&!SYL.has(pyBare(t))
       &&String(hz).toLowerCase().includes(t.toLowerCase()))continue;
    /* Interjections nasales : 嗯 ǹg, 呣 ḿ, 哼 hng… la marque de ton ne
       porte pas sur une voyelle, on ne contrôle donc pas sa place. */
    const nu0=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    if(/^(ng|hm|hng|m|n|ê)$/.test(nu0)){syls.push({raw:t,nu:nu0,ton:0,er:false});continue;}
    const n=pyBare(t);
    let er=false,val=SYL.has(n);
    if(!val&&n.length>2&&n.slice(-1)==='r'&&SYL.has(n.slice(0,-1))){val=true;er=true;}
    if(!val)return{ok:false,code:'syllabe',why:'Syllabe impossible en pinyin : '+t,paires:[],doute:[]};
    const ton=toneOf(t),nu=er?n.slice(0,-1):n;
    const attendu=setTone(nu,ton)+(er?'r':'');
    if(String(t).toLowerCase().replace(/v/g,'ü')!==attendu)
      return{ok:false,code:'marque',why:'Marque de ton mal placée : '+t+' — attendu '+attendu,paires:[],doute:[]};
    syls.push({raw:t,nu:nu,ton:ton,er:er});
  }
  const paires=[];let i=0;
  for(const s of syls){
    if(i>=han.length)break;
    paires.push({c:han[i],s:s});
    i+=(s.er&&han[i+1]==='儿')?2:1;
  }
  if(i!==han.length||paires.length!==syls.length)
    return{ok:false,code:'compte',
      why:han.length+' caractère'+(han.length>1?'s':'')+' pour '+syls.length+' syllabe'+(syls.length>1?'s':''),
      paires:[],doute:[]};
  const doute=[];
  if(!skipDict)paires.forEach((p,k)=>{
    const r=PYDICT[p.c];
    if(r&&r.size===1&&!r.has(p.s.nu+p.s.ton))
      doute.push({i:k,c:p.c,lu:p.s.raw,connu:Array.from(r)[0]});
  });
  return{ok:true,code:doute.length?'doute':'',why:'',paires:paires,doute:doute};
}

/* Dictionnaire des lectures, bâti sur le corpus au démarrage : un
   caractère, l’ensemble des lectures qu’on lui connaît ici. */
const PYDICT={};
function pyLearn(hz,py){
  const r=pinyinCheck(hz,py,true);
  if(!r.ok)return false;
  r.paires.forEach(p=>{(PYDICT[p.c]=PYDICT[p.c]||new Set()).add(p.s.nu+p.s.ton);});
  return true;
}
function buildPyDict(){
  WORDS.forEach(w=>pyLearn(w.hz,w.py));
  CHARS.forEach(c=>pyLearn(c.hz,c.py));
  SENT.forEach(s=>{if(s.py)pyLearn(s.hz,s.py);});
}
buildPyDict();

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div');d.className='toast';d.textContent=m;
  document.body.appendChild(d);setTimeout(()=>d.remove(),3400);
}

/* --- Effets sonores --- */
let AC=null;
function beep(kind){
  if(!S.settings.sfx)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    AC=AC||new Ctx();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const seq=kind==='ok'?[[587,0,.10],[880,.10,.26]]:[[311,0,.13],[233,.13,.30]];
    seq.forEach(([f,s,e])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+s);
      g.gain.exponentialRampToValueAtTime(.14,t+s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+e);
      o.connect(g);g.connect(AC.destination);
      o.start(t+s);o.stop(t+e+.03);
    });
  }catch(e){}
}

/* --- Série de jours --- */
function touchStreak(){
  const d=new Date().toDateString();
  if(S.streak.last===d)return;
  const y=new Date(Date.now()-864e5).toDateString();
  S.streak.n=(S.streak.last===y)?S.streak.n+1:1;
  S.streak.last=d;save();
}

/* --- Répétition espacée (Leitner) --- */
const BOXES=[0,1,3,7,21,60];
function rec(id){if(!S.items[id])S.items[id]={box:0,due:0,seen:0,ok:0,ko:0};return S.items[id];}
function boxOf(id){return (S.items[id]||{box:0}).box;}
function due(id){const r=S.items[id];return !r||r.due<=Date.now();}
function grade(id,g){
  const r=rec(id);r.seen++;
  if(g===0){r.box=0;r.ko++;}
  else if(g===1){r.box=Math.max(0,r.box-1);r.ko++;}
  else{r.box=Math.min(BOXES.length-1,r.box+1);r.ok++;}
  r.due=Date.now()+BOXES[r.box]*864e5;
  touchStreak();save();
}
function mastered(id){const r=S.items[id];return !!r&&r.box>=4;}

/* --- Filtres --- */
function fits(o){
  if(o.hsk!==S.settings.level)return false;
  const T=S.settings.theme;
  if(T!=='all'&&!(o.th||[]).includes(T))return false;
  return true;
}
function pool(){return WORDS.filter(fits);}
function themeName(id){const t=THEMES.find(x=>x.id===id);return t?t.n:'';}
function lessonProgress(l){return (S.lessons[l.id]||[]).length;}
/* Parcours mis en avant sur l’accueil : le dernier ouvert s’il est en cours,
   sinon le premier commencé mais non terminé, sinon le premier non entamé. */
function currentLesson(){
  const lp=LESSONS.filter(l=>l.hsk===S.settings.level);
  if(!lp.length)return null;
  const running=lp.filter(l=>{const p=lessonProgress(l);return p>0&&p<l.steps.length;});
  if(running.length){
    const last=running.find(l=>l.id===S.lastLesson);
    return last||running[0];
  }
  return lp.find(l=>lessonProgress(l)===0)||lp[lp.length-1];
}

/* --- Voix : sélection, locuteurs, pauses --- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if(typeof speechSynthesis!=='undefined'&&speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function zhVoices(){return voices.filter(v=>/^zh/i.test(v.lang));}
function zhVoice(){return zhVoices()[0];}
function byName(n){return voices.find(v=>v.name===n);}
const PITCH={A:1,B:.72,C:1.28};
function voiceFor(who){
  const st=S.settings.voices||{};
  const dedicated=who&&st[who]?byName(st[who]):null;
  const v=dedicated||byName(st.d)||zhVoice();
  return {v:v,pitch:dedicated?1:(who?(PITCH[who]||1):1)};
}
let seqToken=0;
function stopSpeech(){seqToken++;try{speechSynthesis.cancel();}catch(e){}}
function canSpeak(){
  if(typeof speechSynthesis==='undefined'||!speechSynthesis){toast('Synthèse vocale indisponible.');return false;}
  if(!zhVoice()){toast('Aucune voix chinoise sur cet appareil. Ajoutez le pack de langue chinois dans les réglages du système.');return false;}
  return true;
}
function speak(txt,who){
  if(!canSpeak())return;
  stopSpeech();
  const {v,pitch}=voiceFor(who);
  const u=new SpeechSynthesisUtterance(txt);
  u.voice=v;u.lang=v.lang;u.rate=S.settings.rate;u.pitch=pitch;
  speechSynthesis.speak(u);
}
function speakSeq(items){
  if(!canSpeak())return;
  stopSpeech();
  const my=++seqToken;
  let i=0;
  const next=()=>{
    if(my!==seqToken||i>=items.length)return;
    const it=items[i++];
    const {v,pitch}=voiceFor(it.who);
    const u=new SpeechSynthesisUtterance(it.hz);
    u.voice=v;u.lang=v.lang;u.rate=S.settings.rate;u.pitch=pitch;
    u.onend=()=>{if(my===seqToken)setTimeout(next,(S.settings.pause||0)*1000);};
    u.onerror=()=>{};
    speechSynthesis.speak(u);
  };
  next();
}

/* --- Correction assistée (facultative) --- */
async function correct(text,consigne){
  const p=S.settings.provider,k=S.settings.apikey;
  if(p==='none'||!k)throw new Error('aucune clé');
  const prompt=`Tu es professeur de chinois pour une apprenante francophone de niveau HSK${S.settings.level}.
Consigne : ${consigne}
Texte de l’apprenante :
${text}

Réponds en français, brièvement :
1. Version corrigée en chinois, avec pinyin.
2. Les erreurs, une par ligne : écrit → attendu, puis la règle en une phrase.
3. Une reformulation plus naturelle si elle existe.
Pas de préambule ni de conclusion.`;
  if(p==='anthropic'){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
    if(!r.ok)throw new Error('erreur '+r.status);
    const d=await r.json();
    return d.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
  }
  const r=await fetch(gURL('models/'+encodeURIComponent(S.settings.gmodel||'gemini-flash-latest')+':generateContent'),
    {method:'POST',headers:gHead(),body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  if(!r.ok)throw new Error('erreur '+r.status);
  const d=await r.json();
  return ((d.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('\n');
}


/* ---- Essai de la clé : sonder les quatre combinaisons et tout rapporter ---- */
async function testKey(){
  const p=S.settings.provider,k=(S.settings.apikey||'').trim();
  const fin=(ok,msg,det)=>{ctx.test={busy:false,ok:ok,msg:msg,det:det||[]};render();};
  ctx.test={busy:true,msg:'',det:[]};render();
  if(!k)return fin(false,'Aucune clé enregistrée. Collez-la dans le champ ci-dessus.');
  if(p==='anthropic')return testAnthropic(k,fin);

  const combos=[['v1beta','query'],['v1beta','header'],['v1','query'],['v1','header']];
  const essais=[];let bon=null,noms=[];
  for(const c of combos){
    const ver=c[0],auth=c[1];
    let r;
    try{r=await fetch(gURL('models',ver,auth),{headers:gHead(auth)});}
    catch(e){essais.push(ver+' · clé dans l’'+authNom(auth)+
      (auth==='header'?' → refusé avant l’envoi : le navigateur exige un contrôle CORS que ce service n’accorde pas. Depuis une page web, la clé doit passer par l’URL.'
                      :' → serveur injoignable'));continue;}
    if(r.ok){
      let d={};try{d=await r.json();}catch(e){}
      noms=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0)
           .map(m=>String(m.name||'').replace('models/',''));
      essais.push(ver+' · clé dans l’'+authNom(auth)+' → répond, '+noms.length+' modèle'+(noms.length>1?'s':''));
      if(noms.length){bon=c;break;}
      continue;
    }
    const e=await gErrMsg(r);
    essais.push(ver+' · clé dans l’'+authNom(auth)+' → '+e.status+(e.gstatus?' '+e.gstatus:'')+
                (e.message?' : '+e.message.slice(0,160):''));
  }
  if(!bon){
    const t=essais.join(' | ');
    const tousMuets=essais.every(x=>/injoignable|avant l’envoi/.test(x));
    let cause='Aucune des quatre combinaisons ne répond.';
    if(/API key not valid|API_KEY_INVALID/i.test(t))
      cause='Google reçoit bien la clé mais la refuse. Dans neuf cas sur dix ce n’est pas la clé elle-même : '+
            'c’est une restriction posée dessus. Ouvrez la console Google Cloud, Identifiants, puis la clé. '+
            'Si « Restrictions relatives aux applications » est sur « Sites web », ajoutez-y '+
            (location&&location.origin&&location.origin.indexOf('http')===0?location.origin+'/*':'l’adresse de votre site')+
            ' — sinon mettez « Aucune ». Vérifiez aussi que l’API Generative Language est activée sur ce projet.';
    else if(/401|ACCESS_TOKEN_TYPE_UNSUPPORTED|invalid authentication/i.test(t))
      cause='La clé est refusée à l’authentification. C’est le symptôme connu des clés au préfixe AQ. : créez une clé et restreignez-la explicitement à l’API Generative Language.';
    else if(/403|SERVICE_DISABLED|PERMISSION_DENIED/i.test(t))
      cause='L’API Generative Language n’est pas activée sur le projet de cette clé, ou la clé n’a pas ce droit.';
    else if(/404/.test(t))
      cause='Le service ne reconnaît aucune des deux versions d’API avec cette clé. La clé n’est probablement pas rattachée à un projet où l’API Generative Language est activée.';
    else if(tousMuets)
      cause='Le réseau ou le navigateur bloque tous les appels.';
    return fin(false,cause,essais);
  }
  /* gemini-2.5-flash est fermé aux nouveaux comptes depuis 2026 : les alias
     « latest » suivent le modèle courant et ne se périment pas. */
  const pref=['gemini-flash-latest','gemini-2.5-flash-lite','gemini-flash-lite-latest',
              'gemini-2.0-flash','gemini-2.5-flash','gemini-2.5-pro'];
  const cands=pref.filter(x=>noms.indexOf(x)>=0)
    .concat(noms.filter(x=>pref.indexOf(x)<0&&!/tts|image|embedding|vision|live|native-audio/.test(x)));
  S.settings.gver=bon[0];S.settings.gauth=bon[1];save();
  const SCH={type:'object',properties:{hz:{type:'string'}},required:['hz']};
  const MSG=[{role:'user',parts:[{text:'Écris « bonjour » en chinois.'}]}];
  for(const m of cands.slice(0,6)){
    let r=await gemCall(m,'Tu réponds en JSON.',MSG,SCH);
    if(r.ok){
      S.settings.gmodel=m;S.settings.gjson=true;save();
      return fin(true,'Tout fonctionne. Modèle retenu : '+m+', en '+bon[0]+', clé dans l’'+authNom(bon[1])+
        ', sortie JSON structurée. Essai renvoyé : '+String(r.txt).slice(0,40),
        essais.concat(noms.length+' modèles accessibles'));
    }
    essais.push(m+' · JSON structuré → '+r.status+' : '+r.msg);
    r=await gemCall(m,'Tu réponds uniquement par un objet JSON brut.',MSG,null);
    if(r.ok){
      S.settings.gmodel=m;S.settings.gjson=false;save();
      return fin(true,'Fonctionne avec '+m+', mais ce modèle refuse la sortie JSON structurée : '+
        'l’application repasse en JSON simple, sans perte pour vous.',
        essais.concat(noms.length+' modèles accessibles'));
    }
    essais.push(m+' · JSON simple → '+r.status+' : '+r.msg);
  }
  return fin(false,'La clé est reconnue et '+noms.length+' modèles sont listés, mais aucun n’accepte l’appel de '+
    'génération. Le détail ci-dessous donne la raison exacte renvoyée par Google.',essais);
}
async function testAnthropic(k,fin){
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01',
               'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:16,messages:[{role:'user',content:'Réponds : ok'}]})});
  }catch(e){return fin(false,'Impossible de joindre Anthropic. Vérifiez la connexion, ou un blocage du navigateur.');}
  if(r.status===401)return fin(false,'Clé refusée (401). Vérifiez qu’elle est complète et active.');
  if(r.status===400)return fin(false,'Requête refusée (400). La clé est probablement mal collée.');
  if(r.status===429)return fin(false,'Quota épuisé (429), ou crédit insuffisant sur le compte.');
  if(!r.ok)return fin(false,'Erreur '+r.status+'.');
  return fin(true,'Tout fonctionne. La clé Anthropic répond.');
}

/* =====================================================================
   VOCABULAIRE — échelle d’épreuves
   La boîte de Leitner ne règle plus seulement la fréquence : elle règle
   aussi l’exigence. Le jugement est objectif à chaque étage.
   ===================================================================== */
const LADDER=[
  {k:'reco',  n:'Reconnaître', d:'汉字 → français'},
  {k:'prod',  n:'Produire',    d:'français → 汉字'},
  {k:'tons',  n:'Tons',        d:'retrouver le pinyin exact'},
  {k:'trou',  n:'En contexte', d:'compléter la phrase'},
  {k:'trace', n:'Tracer',      d:'écrire de mémoire, sans modèle'},
  {k:'saisie',n:'Traduire',    d:'au clavier chinois'}
];
function sentsFor(w){
  const c=(w.ex?[{hz:w.ex.hz,py:w.ex.py||'',fr:w.ex.fr,hsk:w.hsk,th:w.th}]:[]).concat(SENT);
  return c.filter(x=>x.hz.indexOf(w.hz)>=0)
          .sort((a,b)=>((a.hsk===w.hsk?0:1)-(b.hsk===w.hsk?0:1))||(a.hz.length-b.hz.length));
}
function distract(w,n){
  let c=pool().filter(x=>x.id!==w.id&&x.fr!==w.fr&&x.hz!==w.hz);
  if(c.length<n)c=WORDS.filter(x=>x.hsk===w.hsk&&x.id!==w.id&&x.fr!==w.fr&&x.hz!==w.hz);
  if(c.length<n)c=WORDS.filter(x=>x.id!==w.id&&x.fr!==w.fr&&x.hz!==w.hz);
  return shuffle(c).slice(0,n);
}
function hanOf(t){return [...String(t)].filter(c=>/[\u4e00-\u9fff]/.test(c));}
function makeDrill(w){
  const ss=sentsFor(w);
  let kind=LADDER[Math.min(boxOf(w.id),LADDER.length-1)].k;
  if((kind==='trou'||kind==='saisie')&&!ss.length)kind='prod';
  if(kind==='trace'&&typeof HanziWriter==='undefined')kind='prod';
  const d={kind:kind,w:w,ans:null,mist:0,neuf:!S.items[w.id]};
  if(kind==='reco'||kind==='prod'){
    const hz=(kind==='prod'),good=hz?w.hz:w.fr;
    d.a=shuffle([good].concat(distract(w,3).map(x=>hz?x.hz:x.fr)));
    d.ok=d.a.indexOf(good);d.han=hz;
    d.prompt=hz?w.fr:w.hz;d.promptHan=!hz;
  }
  if(kind==='tons'){
    d.a=shuffle(tonVariants(w.py));d.ok=d.a.indexOf(w.py);
    d.prompt=w.hz;d.promptHan=true;d.han=false;
  }
  if(kind==='trou'){
    /* on préfère une phrase où le mot n’apparaît qu’une fois ; sinon on masque
       toutes ses occurrences, sans quoi la réponse resterait lisible. */
    const uniq=ss.filter(x=>x.hz.split(w.hz).length===2);
    d.s=uniq[0]||ss[0];
    d.a=shuffle([w.hz].concat(distract(w,3).map(x=>x.hz)));
    d.ok=d.a.indexOf(w.hz);d.han=true;
    d.gap=d.s.hz.split(w.hz).join('（\u3000）');
  }
  if(kind==='saisie')d.s=ss[0];
  return d;
}
function startVocab(quick){
  const P=pool();
  if(!P.length)return toast('Aucun mot à ce filtre.');
  const q=P.filter(w=>due(w.id));
  const src=(q.length?q:P).slice().sort((a,b)=>boxOf(a.id)-boxOf(b.id));
  const list=shuffle(src.slice(0,Math.min(src.length,12)));
  ctx.session={ids:list.map(x=>x.id),i:0,right:0,quick:!!quick,rappel:!q.length};
  ctx.show=0;
  ctx.d=quick?null:makeDrill(list[0]);
  render();scrollTo(0,0);
}
function curWord(){return WORDS.find(x=>x.id===ctx.session.ids[ctx.session.i]);}
function vNext(){
  const Z=ctx.session;
  if(Z.i<Z.ids.length-1){
    Z.i++;ctx.show=0;
    ctx.d=Z.quick?null:makeDrill(curWord());
  }else Z.done=true;
  render();scrollTo(0,0);
}
function vAnswer(j){
  const d=ctx.d;if(!d||d.ans!=null)return;
  d.ans=j;
  const good=(j===d.ok);
  beep(good?'ok':'no');
  grade(d.w.id,good?2:0);
  if(good)ctx.session.right++;
  render();
}
function vSubmit(){
  const d=ctx.d;if(!d||d.ans!=null)return;
  const el=document.getElementById('zi');
  const txt=el?el.value:'';
  if(!normZh(txt))return toast('Écrivez la phrase avant de valider.');
  d.txt=txt;
  const good=(normZh(txt)===normZh(d.s.hz));
  d.ans=good?1:0;
  beep(good?'ok':'no');
  grade(d.w.id,good?2:1);
  if(good)ctx.session.right++;
  render();
}
function vSkip(){
  const d=ctx.d;if(!d||d.ans!=null)return;
  d.ans=-1;d.txt=(document.getElementById('zi')||{}).value||'';
  beep('no');grade(d.w.id,0);render();
}
function vTraceDone(){
  const d=ctx.d;if(!d||d.ans!=null)return;
  d.ans=1;
  const good=(d.mist===0);
  beep(good?'ok':'no');
  grade(d.w.id,good?2:(d.mist<=2?1:0));
  if(good)ctx.session.right++;
  render();
}
/* Tracé de mémoire : un carré par caractère, enchaînés automatiquement. */
let TW=[];
function mountTrace(){
  const d=ctx.d;
  if(!d||d.kind!=='trace'||typeof HanziWriter==='undefined')return;
  /* Une séance de tracé déjà en cours et toujours à l’écran : ne pas la relancer. */
  if(d.ans==null&&d.mounted){
    const el0=document.getElementById('tw0');
    if(el0&&el0.childNodes.length)return;
  }
  const chars=hanOf(d.w.hz);
  const size=chars.length>2?102:(chars.length===2?138:196);
  TW=[];
  chars.forEach((c,k)=>{
    const el=document.getElementById('tw'+k);if(!el)return;
    el.innerHTML='';
    TW.push(HanziWriter.create(el,c,{width:size,height:size,padding:8,
      showCharacter:d.ans!=null,showOutline:d.ans!=null,delayBetweenStrokes:150,
      strokeColor:'#2C2723',outlineColor:'#E2D6C4',drawingColor:'#B8342E',highlightColor:'#3D7A69'}));
  });
  if(d.ans!=null)return;
  d.mounted=true;
  const run=k=>{
    if(k>=TW.length)return vTraceDone();
    TW[k].quiz({onComplete(r){
      d.mist+=r.totalMistakes;
      TW[k].showCharacter();TW[k].showOutline();
      const box=document.getElementById('tw'+k);if(box)box.className='tbox ok';
      setTimeout(()=>run(k+1),320);
    }});
  };
  run(0);
}
function vReveal(){
  const d=ctx.d;if(!d||d.ans!=null)return;
  d.ans=-1;beep('no');grade(d.w.id,0);render();
  setTimeout(()=>TW.forEach((t,i)=>setTimeout(()=>t.animateCharacter(),i*900)),120);
}

/* ---- 改错 : en ligne dans la Grammaire ---- */
function fixBlock(x){

  <div class="box"><p class="sm" style="margin:0"><b>${esc(x.consigne)}</b></p></div>

      }).join('')}</div>

function fixTap(key,k,bad){
  ctx.fx=ctx.fx||{};
  if(ctx.fx[key]&&ctx.fx[key].t!=null)return;
  ctx.fx[key]={t:k,f:null};
  beep(k===bad?'ok':'no');touchStreak();save();render();
}
function fixPick(key,j,ok){
  const st=(ctx.fx||{})[key];
  if(!st||st.t==null||st.f!=null)return;
  st.f=j;beep(j===ok?'ok':'no');save();render();
}

/* ---- Appariement et tableau : écran dédié ---- */
function gridGaps(x){
  const o=[];x.rows.forEach(r=>r.forEach(c=>{if(c&&typeof c==='object'&&c.g)o.push(c.g);}));return o;
}
function openExo(id){
  const x=EXOS.find(e=>e.id===id);if(!x)return;
  const st={id:id};
  if(x.kind==='match'){st.order=shuffle(x.pairs.map((p,i)=>i));st.sel=null;st.done=[];st.ko=0;st.bad=null;}
  if(x.kind==='grid'){st.cell=null;st.fill={};st.checked=false;st.bank=shuffle(gridGaps(x).concat(x.extra||[]));}
  go('exo',{exo:st});
}
function mTap(side,i){
  const st=ctx.exo;if(!st)return;
  if(side==='l'){
    if(st.done.indexOf(i)>=0)return;
    st.sel=(st.sel===i?null:i);st.bad=null;return render();
  }
  const pi=st.order[i];
  if(st.done.indexOf(pi)>=0)return;
  if(st.sel==null)return toast('Choisissez d’abord un mot dans la colonne de gauche.');
  if(pi===st.sel){st.done.push(pi);beep('ok');st.bad=null;}
  else{st.ko++;beep('no');st.bad=i;}
  st.sel=null;touchStreak();save();render();
}
function gTapCell(k){
  const st=ctx.exo;if(!st||st.checked)return;
  if(st.fill[k]!=null){st.bank.push(st.fill[k]);delete st.fill[k];st.cell=null;return render();}
  st.cell=(st.cell===k?null:k);render();
}
function gTapBank(i){
  const st=ctx.exo;if(!st||st.checked)return;
  if(st.cell==null)return toast('Touchez d’abord une case vide du tableau.');
  st.fill[st.cell]=st.bank[i];st.bank.splice(i,1);st.cell=null;render();
}
function gCheck(){
  const st=ctx.exo;if(!st)return;
  st.checked=true;st.cell=null;touchStreak();save();render();scrollTo(0,0);
}
function vExo(){
  const st=ctx.exo;if(!st)return vVocab();
  const x=EXOS.find(e=>e.id===st.id);if(!x)return vVocab();
  return x.kind==='match'?exoMatch(x,st):exoGrid(x,st);
}
function exoMatch(x,st){
  const n=x.pairs.length,fini=st.done.length===n;
  return header(x.titre,`${st.done.length} / ${n} paires`)+`
  <div class="box"><p class="sm" style="margin:0"><b>${esc(x.consigne)}</b></p></div>
  <div class="mgrid">
    <div>${x.pairs.map((pr,i)=>{
      const d=st.done.indexOf(i)>=0;
      return `<button class="mit ${x.han&&x.han.l?'hz':''} ${d?'ok':(st.sel===i?'sel':'')}" onclick="mTap('l',${i})">${esc(pr[0])}</button>`;
    }).join('')}</div>
    <div>${st.order.map((pi,i)=>{
      const d=st.done.indexOf(pi)>=0,lab=x.pairs[pi][1];
      return `<button class="mit ${d?'ok':(st.bad===i?'no':'')}" onclick="mTap('r',${i})">${x.py?pinyin(lab):esc(lab)}</button>`;
    }).join('')}</div>
  </div>
  ${fini
    ?`<div class="verdict ${st.ko?'no':'ok'} mt">${st.ko?st.ko+' erreur'+(st.ko>1?'s':'')+' avant d’arriver au bout.':'Toutes les paires du premier coup.'}</div>
      <button class="btn pale" onclick="openExo('${x.id}')">Recommencer</button>`
    :`<p class="mut sm mt">Touchez un mot à gauche, puis son correspondant à droite. Les paires justes se verrouillent.</p>`}`;
}
function exoGrid(x,st){
  let tot=0,bon=0;
  const corps=x.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>{
    const k=ri+'-'+ci;
    if(!(c&&typeof c==='object'&&c.g))return `<td><div class="gc">${esc(c)}</div></td>`;
    tot++;
    const v=st.fill[k];
    let cl=v!=null?'fill':'gap',txt=(v!=null?v:'?');
    if(st.checked){
      const juste=(v===c.g);if(juste)bon++;
      cl=juste?'ok':'no';txt=c.g;
    }else if(st.cell===k)cl='sel';
    return `<td><button class="gc ${cl}" onclick="gTapCell('${k}')">${esc(txt)}</button></td>`;
  }).join('')}</tr>`).join('');
  const reste=Object.keys(st.fill).length;
  return header(x.titre,`${reste} / ${tot} cases remplies`)+`
  <div class="box"><p class="sm" style="margin:0"><b>${esc(x.consigne)}</b></p></div>
  <div class="box">
    <table class="gtab"><thead><tr>${x.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${corps}</tbody></table>
  </div>
  ${st.checked
    ?`<div class="box"><div class="score"><div class="n">${bon}<small> / ${tot}</small></div>
        <div class="lbl">cases justes</div></div>
      <div class="bar" style="margin:12px 0"><i style="width:${Math.round(bon/tot*100)}%;background:${bon===tot?'var(--jade)':'var(--red)'}"></i></div>
      <p class="mut sm">Les cases en rouge affichent la réponse attendue.</p>
      <button class="btn pale" onclick="openExo('${x.id}')">Recommencer</button></div>`
    :`<h2 class="sec">Étiquettes</h2>
      <div class="tiles">${st.bank.map((b,i)=>`<button class="tile" onclick="gTapBank(${i})">${esc(b)}</button>`).join('')}</div>
      <button class="btn jade mt" onclick="gCheck()">Vérifier</button>
      <p class="mut sm mt">Touchez une case vide, puis l’étiquette. Touchez une case remplie pour la vider.</p>`}`;
}

function vVocab(){
  const P=pool();
  if(!P.length)return header('Vocabulaire')+levelPills()+nothing();
  if(!ctx.session)return vocabHome(P);
  if(ctx.session.done)return vocabScore();
  return ctx.session.quick?vocabFlash():vocabDrill();
}

function vocabHome(P){
  const q=P.filter(w=>due(w.id)),ma=P.filter(w=>mastered(w.id)).length;
  return header('Vocabulaire',`${q.length} à réviser · ${ma} acquis sur ${P.length}`)+ribbon()+`
  <div class="box">
    <p class="sm" style="margin:0 0 4px"><b>Une épreuve différente à chaque étage</b></p>
    <p class="mut sm">La boîte d’un mot ne décide plus seulement de la date à laquelle il revient, mais de ce qu’on vous demande d’en faire. Chaque réponse est jugée, plus rien n’est déclaratif.</p>
    ${LADDER.map((L,i)=>`<div class="ladder">
      <span class="bx ${P.some(w=>boxOf(w.id)===i)?'on':''}">${i}</span>
      <span class="tx"><b>${esc(L.n)}</b> — <span class="mut">${esc(L.d)}</span></span>
      <span class="st mut sm">${P.filter(w=>boxOf(w.id)===i).length}</span>
    </div>`).join('')}
  </div>
  <button class="btn" onclick="startVocab(0)">${q.length?`Séance — ${Math.min(q.length,12)} mot${Math.min(q.length,12)>1?'s':''}`:'Séance libre — 12 mots'}</button>
  <button class="btn pale mt" onclick="startVocab(1)">Révision rapide — cartes à retourner</button>
  ${exoAt('match').concat(exoAt('grid')).map(x=>`<button class="wrow" style="width:100%;text-align:left;margin-top:9px"
    onclick="openExo('${x.id}')">
    <span class="g" style="font-family:var(--han);font-size:23px;color:var(--clay)">${x.kind==='match'?'配':'表'}</span>
    <span class="m"><b>${esc(x.titre)}</b><span class="mut">${esc(x.consigne)}</span></span></button>`).join('')}
  <p class="mut sm mt">La révision rapide ne fait pas monter les boîtes : elle sert aux trajets, quand vous ne pouvez ni tracer ni taper.</p>
  <h2 class="sec">Les mots de ce filtre</h2>
  ${P.map(x=>`<div class="wrow">
    <span class="g">${esc(x.hz)}</span>
    <span class="m"><b>${esc(x.fr)}</b><span class="py">${pinyin(x.py)}</span></span>
    ${mastered(x.id)?'<span class="seal">印</span>':`<span class="st">boîte ${boxOf(x.id)}</span>`}
  </div>`).join('')}`;
}

function vocabProg(){
  const Z=ctx.session;
  return `<div class="qnum">Mot ${Z.i+1} sur ${Z.ids.length}${ctx.d?' · '+esc((LADDER.find(L=>L.k===ctx.d.kind)||{}).n||''):''}</div>
  <div class="qprog">${Z.ids.map((id,k)=>{
    const cl=k===Z.i?'now':(k<Z.i?'ok':'');
    return `<i class="${cl}"></i>`;}).join('')}</div>`;
}

function vocabDrill(){
  const d=ctx.d,w=d.w,rep=d.ans!=null;
  const fiche=`<div class="box" style="text-align:center">
      <div class="hz" style="font-size:44px;font-weight:700;line-height:1.2">${esc(w.hz)}</div>
      <div class="py" style="font-size:19px">${pinyin(w.py)}</div>
      <p class="mut" style="margin:4px 0 10px">${esc(w.fr)}</p>
      <button class="btn pale tiny" onclick="speak('${jq(w.hz)}')">Écouter</button>
    </div>`;
  const suite=rep?`<button class="btn mt" onclick="vNext()">${ctx.session.i<ctx.session.ids.length-1?'Mot suivant':'Voir le bilan'}</button>`:'';

  /* --- QCM : reconnaître, produire, tons, phrase à trou --- */
  if(d.kind==='reco'||d.kind==='prod'||d.kind==='tons'||d.kind==='trou'){
    const consigne={reco:'Que signifie ce mot ?',prod:'Quel mot correspond ?',
      tons:'Quel pinyin est exact ? Les tons seuls diffèrent.',
      trou:'Complétez la phrase.'}[d.kind];
    return header('Vocabulaire',w.fr&&d.kind!=='reco'?'':' ')+vocabProg()+
    (d.neuf&&d.kind==='reco'&&!rep?`<div class="verdict ok">Premier passage sur ce mot — regardez-le, puis répondez.</div>`+fiche:'')+`
    <div class="box">
      <p class="mut sm" style="margin:0 0 6px">${esc(consigne)}</p>
      ${d.kind==='trou'
        ?`<div class="sentence">${esc(d.gap)}</div>
          <p class="mut sm" style="margin:6px 0 0">${esc(d.s.fr)}</p>`
        :`<div class="prompt"><div class="${d.promptHan?'big':'med'}">${esc(d.prompt)}</div></div>`}
      ${d.kind==='tons'?`<div style="text-align:center"><button class="btn pale tiny" onclick="speak('${jq(w.hz)}')">Écouter</button></div>`:''}
      <div class="opts">${d.a.map((opt,j)=>{
        let cl='';if(rep)cl=(j===d.ok)?'ok':(j===d.ans?'no':'');
        return `<button class="opt ${d.han?'han':''} ${cl}" onclick="vAnswer(${j})">${d.kind==='tons'?pinyin(opt):esc(opt)}</button>`;
      }).join('')}</div>
      ${rep?`<div class="verdict ${d.ans===d.ok?'ok':'no'}">${d.ans===d.ok?'Juste.':'Réponse attendue : '+esc(d.a[d.ok])+'.'} ${esc(w.hz)} — ${esc(w.py)} — ${esc(w.fr)}</div>
        <button class="btn pale sm" onclick="speak('${jq(d.kind==='trou'?d.s.hz:w.hz)}')">Écouter</button>`:''}
    </div>
    ${suite}`;
  }

  /* --- Tracé de mémoire --- */
  if(d.kind==='trace'){
    const chars=hanOf(w.hz);
    const size=chars.length>2?102:(chars.length===2?138:196);
    return header('Vocabulaire',' ')+vocabProg()+`
    <div class="box" style="text-align:center">
      <p class="mut sm" style="margin:0 0 4px">Écrivez ce mot de mémoire. Aucun contour n’est affiché.</p>
      <div class="fr" style="font-size:20px;font-weight:700">${esc(w.fr)}</div>
      <div class="py" style="font-size:18px;margin-bottom:12px">${pinyin(w.py)}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${chars.map((c,k)=>`<div id="tw${k}" class="tbox" style="width:${size}px;height:${size}px"></div>`).join('')}
      </div>
      ${rep?`<div class="verdict ${d.ans===-1?'no':(d.mist===0?'ok':'no')} mt">${
          d.ans===-1?'Tracé révélé — le mot revient en boîte 0.'
          :(d.mist===0?'Sans une seule erreur de tracé.':d.mist+' erreur(s) de tracé.')
        } ${esc(w.hz)} — ${esc(w.py)}</div>`
       :`<button class="btn pale sm mt" onclick="vReveal()">Je ne m’en souviens pas — montrer</button>`}
    </div>
    ${suite}`;
  }

  /* --- Saisie au clavier chinois --- */
  const dz=rep?diffZh(d.txt||'',d.s.hz):null;
  return header('Vocabulaire',' ')+vocabProg()+`
  <div class="box">
    <p class="mut sm" style="margin:0 0 6px">Écrivez cette phrase en chinois, au clavier. Elle contient ${esc(w.hz)}.</p>
    <p style="font-size:18px;font-weight:700;margin:0 0 12px">${esc(d.s.fr)}</p>
    ${rep?'':`<textarea id="zi" rows="2" placeholder="汉字…"></textarea>
      <div class="row mt">
        <button class="btn jade sm" onclick="vSubmit()">Valider</button>
        <button class="btn pale sm" onclick="vSkip()">Je passe</button>
      </div>`}
    ${rep?`<div class="verdict ${d.ans===1?'ok':'no'}">${d.ans===1?'Identique au modèle.':(d.ans===-1?'Phrase passée.':'Ce n’est pas tout à fait ça.')}</div>
      ${d.ans!==1?`<p class="mut sm" style="margin:0 0 2px">Vous avez écrit</p>
        <div class="diff" style="color:var(--red-d)">${dz.you||'—'}</div>
        <p class="mut sm" style="margin:10px 0 2px">Attendu</p>`:'<p class="mut sm" style="margin:0 0 2px">Modèle</p>'}
      <div class="diff" style="color:var(--jade-d)">${dz.exp}</div>
      ${d.s.py?`<p class="py sm" style="margin-top:6px">${pinyin(d.s.py)}</p>`:''}
      <button class="btn pale sm mt" onclick="speak('${jq(d.s.hz)}')">Écouter</button>`:''}
  </div>
  ${suite}`;
}

function vocabFlash(){
  const w=curWord();
  ctx.dir=ctx.dir||'hz-fr';
  const front=ctx.dir==='hz-fr'?`<div class="glyph">${esc(w.hz)}</div>`:`<div class="fr">${esc(w.fr)}</div>`;
  const rev=ctx.dir==='hz-fr'
    ?`<div class="py">${pinyin(w.py)}</div><div class="fr" style="margin-top:6px">${esc(w.fr)}</div>`
    :`<div class="glyph sm">${esc(w.hz)}</div><div class="py">${pinyin(w.py)}</div>`;
  return header('Révision rapide','Les boîtes ne bougent pas')+vocabProg()+`
  <div class="row" style="margin-bottom:12px">
    <button class="btn ${ctx.dir==='hz-fr'?'':'pale'} sm" onclick="ctx.dir='hz-fr';ctx.show=0;render()">汉字 → fr</button>
    <button class="btn ${ctx.dir==='fr-hz'?'':'pale'} sm" onclick="ctx.dir='fr-hz';ctx.show=0;render()">fr → 汉字</button>
  </div>
  <div class="card3d">
    ${front}
    ${ctx.show?`<hr>${rev}<button class="btn pale tiny mt" onclick="speak('${jq(w.hz)}')">Écouter</button>`:''}
  </div>
  ${ctx.show?`<button class="btn mt" onclick="vNext()">${ctx.session.i<ctx.session.ids.length-1?'Mot suivant':'Terminer'}</button>`
            :`<button class="btn mt" onclick="ctx.show=1;render()">Voir la réponse</button>`}`;
}

function vocabScore(){
  const Z=ctx.session,n=Z.ids.length;
  if(Z.quick)return header('Révision rapide')+`
    <div class="box"><div class="score"><div class="n">${n}</div><div class="lbl">mot${n>1?'s':''} passé${n>1?'s':''} en revue</div></div>
    <p class="mut sm">Aucune boîte n’a bougé : c’était une lecture, pas une épreuve.</p></div>
    <button class="btn" onclick="ctx.session=null;ctx.d=null;render()">Retour au vocabulaire</button>`;
  const pct=Math.round(Z.right/n*100);
  const monte=Z.ids.filter(id=>boxOf(id)>0).length;
  return header('Séance terminée')+`
  <div class="box">
    <div class="score"><div class="n">${Z.right}<small> / ${n}</small></div><div class="lbl">${pct}% de réussite</div></div>
    <div class="bar" style="margin:14px 0"><i style="width:${pct}%;background:${pct>=75?'var(--jade)':'var(--red)'}"></i></div>
    <p class="mut sm">${monte} mot${monte>1?'s':''} au-dessus de la boîte 0. Les mots ratés reviendront dès la prochaine séance, au même étage.</p>
  </div>
  <button class="btn" onclick="startVocab(0)">Nouvelle séance</button>
  <button class="btn pale mt" onclick="ctx.session=null;ctx.d=null;render()">Retour au vocabulaire</button>`;
}

/* ---------- Caractères ---------- */
function vChars(){
  const P=CHARS.filter(fits);
  if(!P.length)return header('Caractères')+levelPills()+nothing();
  ctx.c=ctx.c||P[0].id;
  const c=P.find(x=>x.id===ctx.c)||P[0];
  return header('Caractères','Ordre des traits et tracé')+ribbon()+`
  <div class="box" style="text-align:center">
    <div id="tian" style="width:232px;height:232px;margin:0 auto;border-radius:20px;background:#FEFCF8;border:2px solid var(--line)"></div>
    <div class="hz" style="font-size:29px;font-weight:700;margin-top:12px">${esc(c.hz)}</div>
    <div class="py" style="font-size:18px">${pinyin(c.py)}</div>
    <p class="mut" style="margin-top:2px">${esc(c.fr)}</p>
    <p class="mut sm" id="wstatus">Chargement des tracés…</p>
    <div class="row mt">
      <button class="btn pale" onclick="anim()">Animer</button>
      <button class="btn" onclick="quiz()">Tracer</button>
    </div>
  </div>
  <h2 class="sec">Choisir un caractère</h2>
  <div class="tiles">${P.map(x=>`<button class="tile" onclick="ctx.c='${x.id}';render()"
    style="${x.id===c.id?'border-color:var(--indigo);color:var(--indigo)':''}">${esc(x.hz)}</button>`).join('')}</div>`;
}
let W=null;
function mountWriter(){
  const el=document.getElementById('tian');if(!el)return;
  const st=document.getElementById('wstatus');
  const c=CHARS.find(x=>x.id===ctx.c);
  if(typeof HanziWriter==='undefined'){
    if(st)st.textContent='Tracés indisponibles : la bibliothèque n’a pas pu être chargée. Vérifiez la connexion.';
    return;
  }
  el.innerHTML='';
  W=HanziWriter.create(el,c.hz,{width:232,height:232,padding:14,
    showCharacter:true,showOutline:true,delayBetweenStrokes:170,
    strokeColor:'#2C2723',outlineColor:'#E2D6C4',drawingColor:'#B8342E',highlightColor:'#3D7A69'});
  if(st)st.textContent='« Animer » montre l’ordre des traits. « Tracer » vous fait écrire au doigt.';
}
function anim(){if(W)W.animateCharacter();}
function quiz(){
  if(!W)return;
  const c=CHARS.find(x=>x.id===ctx.c);
  W.hideCharacter();
  W.quiz({onComplete(d){
    const good=d.totalMistakes===0;
    beep(good?'ok':'no');
    grade(c.id,good?2:(d.totalMistakes<=2?1:0));
    toast(good?'Tracé juste, sans erreur !':d.totalMistakes+' erreur(s) de tracé.');
    W.showCharacter();render();
  }});
}

/* ---------- Choix multiples en liste (fiches d’étude) ---------- */
function opts(key,q,han,nextKey){
  ctx.ans=ctx.ans||{};
  const ch=ctx.ans[key];
  return `<div class="opts">${q.a.map((a,j)=>{
    let cl='';if(ch!=null)cl=(j===q.ok)?'ok':(j===ch?'no':'');
    return `<button class="opt ${han?'han':''} ${cl}" onclick="pick('${key}',${j},${q.ok},${nextKey?`'${nextKey}'`:'null'})">${esc(a)}</button>`;
  }).join('')}</div>
  ${ch!=null?`<div class="verdict ${ch===q.ok?'ok':'no'}">${ch===q.ok?'Juste.':'Ce n’est pas la bonne réponse.'}${q.why?' '+q.why:''}</div>`:''}`;
}
function pick(key,j,ok,nextKey){
  ctx.ans=ctx.ans||{};
  if(ctx.ans[key]!=null)return;
  ctx.ans[key]=j;
  beep(j===ok?'ok':'no');
  touchStreak();save();
  if(S.settings.auto&&nextKey)ctx.scrollTo=nextKey;
  render();
}

    <div class="sentence">${esc(e.hz)}</div>

  <h2 class="sec">À vous</h2>

/* ---------- Compréhension ---------- */
function vCO(){return comp('CO','Compréhension orale','Écoutez d’abord, le texte reste caché');}
function vCE(){return comp('CE','Compréhension écrite','Lisez, puis répondez');}
/* ---- Affichage du document : suivi d’un bloc, ou découpé phrase à phrase ---- */
function setFlow(f){S.settings.flow=f;save();render();}
function flowPills(){
  const f=S.settings.flow==='suivi'?'suivi':'decoupe';
  return `<div class="pills" style="margin-bottom:12px">
    <button class="pill ${f==='suivi'?'on':''}" onclick="setFlow('suivi')">Texte suivi</button>
    <button class="pill ${f==='decoupe'?'on':''}" onclick="setFlow('decoupe')">Découpé</button>
  </div>`;
}
function seqOf(t){return JSON.stringify(t.lines.map(l=>({hz:l.hz,who:l.who||null}))).replace(/'/g,'&#39;');}
function docBody(t){
  const dial=t.lines.some(l=>l.who);
  if(S.settings.flow==='suivi'){
    const bloc=k=>dial
      ? t.lines.map(l=>`<div style="margin:0 0 8px"><span class="mut sm">${esc(l.who)} — </span>${k==='py'?pinyin(l.py):esc(l[k])}</div>`).join('')
      : (k==='py'?t.lines.map(l=>pinyin(l.py)).join(' ')
                 :esc(t.lines.map(l=>l[k]).join(k==='hz'?'':' ')));
    return `<div class="box">
      <div class="sentence" style="line-height:1.95">${bloc('hz')}</div>
      ${ctx.py?`<div class="py sm" style="margin-top:10px">${bloc('py')}</div>`:''}
      ${ctx.fr?`<p class="mut sm" style="margin-top:10px">${bloc('fr')}</p>`:''}
    </div>`;
  }
  return t.lines.map(l=>`<div class="box">
    ${l.who?`<p class="mut sm" style="margin:0 0 4px">Locuteur ${esc(l.who)}</p>`:''}
    <div class="sentence">${esc(l.hz)}</div>
    ${ctx.py?`<div class="py sm">${pinyin(l.py)}</div>`:''}
    ${ctx.fr?`<p class="mut sm" style="margin:6px 0 0">${esc(l.fr)}</p>`:''}
    <button class="btn pale tiny mt" onclick="speak('${jq(l.hz)}'${l.who?`,'${l.who}'`:''})">Écouter</button>
  </div>`).join('');
}
function docTools(t,mode){
  return `<div class="row mt">
    <button class="btn pale sm" onclick="ctx.py=!ctx.py;render()">${ctx.py?'Cacher':'Voir'} pinyin</button>
    <button class="btn pale sm" onclick="ctx.fr=!ctx.fr;render()">${ctx.fr?'Cacher':'Voir'} traduction</button>
    ${mode==='CO'?`<button class="btn pale sm" onclick="ctx.hz=!ctx.hz;render()">${ctx.hz?'Cacher':'Voir'} texte</button>`:''}
  </div>`;
}

/* =====================================================================
   DÉCOUVERTE — premier contact avec le document.
   Aucune question de détail : un repérage global, construit
   automatiquement à partir des mots du thème, et une ou deux questions
   d’ensemble rédigées avec le document.
   ===================================================================== */
function makeRep(t){
  const txt=t.lines.map(l=>l.hz).join('');
  const dansTh=WORDS.filter(w=>w.hsk===t.hsk&&(w.th||[]).some(x=>(t.th||[]).includes(x))&&txt.includes(w.hz));
  const dansTout=WORDS.filter(w=>w.hsk===t.hsk&&txt.includes(w.hz));
  const dedans=shuffle(dansTh.length>=5?dansTh:dansTout).slice(0,5);
  const dehors=shuffle(WORDS.filter(w=>w.hsk===t.hsk&&!txt.includes(w.hz))).slice(0,3);
  return {items:shuffle(dedans.concat(dehors)).map(w=>({hz:w.hz,py:w.py,fr:w.fr,dans:txt.includes(w.hz)})),
          sel:{},checked:false};
}
function repPick(i){
  const r=ctx.rep;if(!r||r.checked)return;
  r.sel[i]=!r.sel[i];render();
}
function repCheck(){
  const r=ctx.rep;if(!r||r.checked)return;
  r.checked=true;
  const juste=r.items.every((it,i)=>!!r.sel[i]===it.dans);
  beep(juste?'ok':'no');render();
}
function repBlock(){
  const r=ctx.rep,co=ctx.mode==='CO';
  const bons=r.items.filter(it=>it.dans).length;
  const trouves=r.items.filter((it,i)=>it.dans&&r.sel[i]).length;
  const faux=r.items.filter((it,i)=>!it.dans&&r.sel[i]).length;
  return `<h2 class="sec">Repérage</h2>
  <div class="box"><p class="sm" style="margin:0"><b>${co?'Quels mots avez-vous entendus ?':'Quels mots trouvez-vous dans le texte ?'}</b>
    <br><span class="mut">Il y en a ${bons} sur ${r.items.length}. Trois sont des intrus.</span></p></div>
  <div class="opts">${r.items.map((it,i)=>{
    let cl='';
    if(r.checked)cl=it.dans?'ok':(r.sel[i]?'no':'');
    else if(r.sel[i])cl='pick';
    return `<button class="opt han ${cl}" onclick="repPick(${i})">${esc(it.hz)}
      ${r.checked?`<span class="mut sm"> — ${esc(it.fr)}</span>`:''}</button>`;
  }).join('')}</div>
  ${r.checked
    ?`<div class="verdict ${trouves===bons&&!faux?'ok':'no'}">${trouves} mot${trouves>1?'s':''} sur ${bons} repéré${trouves>1?'s':''}${faux?`, ${faux} intrus retenu${faux>1?'s':''}`:''}.</div>`

const shuffled={};
function bagOf(p,built){
  const used=(built||[]).slice(),rest=[];
  p.words.forEach(w=>{const k=used.indexOf(w);if(k>=0)used.splice(k,1);else rest.push(w);});
  if(!shuffled[p.id])shuffled[p.id]=shuffle(p.words);
  const bag=[],tmp=rest.slice();
  shuffled[p.id].forEach(w=>{const k=tmp.indexOf(w);if(k>=0){bag.push(w);tmp.splice(k,1);}});
  tmp.forEach(w=>bag.push(w));
  return bag;
}
function pOrdre(p){
  ctx.built=ctx.built||[];
  const bag=bagOf(p,ctx.built);
  const done=ctx.built.join('')===p.ok;
  if(!bag.length&&!ctx.rang){ctx.rang=1;beep(done?'ok':'no');}
  if(bag.length)ctx.rang=0;
  return `<div class="box">
    <p><b>${esc(p.consigne)}</b></p>
    <p class="mut sm">${esc(p.fr)}</p>
    <div class="drop">${ctx.built.map((w,i)=>`<button class="tile" onclick="unbuild(${i})">${esc(w)}</button>`).join('')
      ||'<span class="mut sm" style="padding:0 6px">Touchez les mots dans l’ordre</span>'}</div>
    <div class="tiles mt">${bag.map((w,i)=>`<button class="tile" onclick="build(${i},'${jq(p.id)}')">${esc(w)}</button>`).join('')}</div>
    ${!bag.length?`<div class="verdict ${done?'ok':'no'} mt">${done?'Phrase juste !':'Ordre incorrect. Réponse : '+esc(p.ok)}</div>
      ${done?`<button class="btn jade mt" onclick="speakSeq([{hz:'${jq(p.ok)}'}])">Écouter la phrase</button>`:''}`:''}
    <button class="btn pale mt" onclick="ctx.built=[];ctx.rang=0;render()">Recommencer</button>
  </div>`;
}
function build(i,pid){
  const p=PROD.find(x=>x.id===pid);
  const bag=bagOf(p,ctx.built);
  ctx.built=(ctx.built||[]).concat(bag[i]);
  if(ctx.built.length===p.words.length)touchStreak();
  render();
}
function unbuild(i){ctx.built.splice(i,1);ctx.rang=0;render();}
function pTrad(p){

    ${ctx.aiout?`<div class="verdict ok mt" style="white-space:pre-wrap">${esc(ctx.aiout)}</div>`:''}

function pLibre(p){

/* =====================================================================
   6. EXERCICES QUESTION PAR QUESTION (mots du texte, bilan noté)
   ===================================================================== */
function vocabQuestions(words,n){
  if(!words.length)return [];
  const ranked=words.slice().sort((a,b)=>boxOf(a.id)-boxOf(b.id));
  const picked=shuffle(ranked.slice(0,Math.min(words.length,Math.max(n,Math.ceil(n*1.6))))).slice(0,Math.min(n,words.length));
  return picked.map((w,k)=>{
    const others=shuffle(words.filter(x=>x.id!==w.id)).slice(0,3);
    const toHz=(k%2===1)&&others.length===3;
    const good=toHz?w.hz:w.fr;
    const a=shuffle([good].concat(others.map(o=>toHz?o.hz:o.fr)));
    return {kind:'vocab',wid:w.id,audio:w.hz,
      prompt:toHz?w.fr:w.hz,promptHan:!toHz,
      hint:toHz?null:null,
      a:a,ok:a.indexOf(good),han:toHz,
      why:`${w.hz} — ${w.py} — ${w.fr}`};
  });
}
function lessonQuiz(l,mode){
  const words=WORDS.filter(w=>w.hsk===l.hsk&&w.th.includes(l.theme));
  if(mode==='mots')return vocabQuestions(words,Math.min(8,words.length));
  const qs=vocabQuestions(words,4);
  const g=GRAMMAR.find(x=>l.steps.some(s=>s.k==='gram'&&s.ref===x.id));
  if(g)shuffle(g.qcm).slice(0,2).forEach(q=>qs.push({kind:'gram',prompt:q.q,promptHan:false,a:q.a,ok:q.ok,han:false,why:q.why}));
  const t=TEXTS.find(x=>l.steps.some(s=>s.k==='text'&&s.ref===x.id));
  if(t)shuffle(t.qcm).slice(0,2).forEach(q=>qs.push({kind:'texte',prompt:q.q,promptHan:true,a:q.a,ok:q.ok,han:true,
    audio:t.lines.map(x=>x.hz).join(''),why:null}));
  return shuffle(qs);
}
function startQuiz(lid,mode,stepIndex){
  const l=LESSONS.find(x=>x.id===lid);
  const qs=lessonQuiz(l,mode);
  if(!qs.length){toast('Pas assez de contenu pour cet exercice à ce niveau.');return;}
  go(mode,{quiz:{lid:lid,mode:mode,qs:qs,i:0,ans:[]},from:{l:lid,i:stepIndex}});
}
function qAnswer(j){
  const Q=ctx.quiz,q=Q.qs[Q.i];
  if(Q.ans[Q.i]!=null)return;
  const good=j===q.ok;
  Q.ans[Q.i]=j;
  beep(good?'ok':'no');
  if(q.kind==='vocab'&&q.wid)grade(q.wid,good?2:0);
  touchStreak();save();
  render();
  if(S.settings.auto)setTimeout(()=>{if(ctx.quiz===Q&&Q.ans[Q.i]!=null)qNext();},1300);
}
function qNext(){
  const Q=ctx.quiz;
  if(Q.i<Q.qs.length-1){Q.i++;render();scrollTo(0,0);}
  else{Q.done=true;render();scrollTo(0,0);}
}
function qRestart(){
  const Q=ctx.quiz;
  const l=LESSONS.find(x=>x.id===Q.lid);
  ctx.quiz={lid:Q.lid,mode:Q.mode,qs:lessonQuiz(l,Q.mode),i:0,ans:[]};
  render();scrollTo(0,0);
}
function vQuiz(){
  const Q=ctx.quiz;
  if(!Q)return vParcours();
  const l=LESSONS.find(x=>x.id===Q.lid);
  const titre=Q.mode==='mots'?'Les mots du texte':'Bilan noté';
  const right=Q.ans.filter((a,k)=>a===Q.qs[k].ok).length;

  if(Q.done){
    const total=Q.qs.length,pct=Math.round(right/total*100);
    const seuil=Q.mode==='bilan'?Math.ceil(total*.75):Math.ceil(total*.6);
    const pass=right>=seuil;
    const faibles=Q.qs.map((q,k)=>[q,Q.ans[k]]).filter(([q,a])=>a!==q.ok);
    const parType=k=>faibles.filter(([q])=>q.kind===k).length;
    return header(titre,l.title)+`
    <div class="box">
      <div class="score"><div class="n">${right}<small> / ${total}</small></div>
        <div class="lbl">${pct}% de réponses justes</div></div>
      <div class="bar" style="margin:14px 0"><i style="width:${pct}%;background:${pass?'var(--jade)':'var(--red)'}"></i></div>
      <div class="verdict ${pass?'ok':'no'}">${pass
        ?(Q.mode==='bilan'?'Bilan réussi. Le thème est validé à ce niveau.':'Bien joué, les mots sont en place.')
        :`Il faut ${seuil} bonnes réponses sur ${total} pour valider. Reprenez et recommencez.`}</div>
      ${faibles.length?`<p class="mut sm">À revoir : ${[
        parType('vocab')?parType('vocab')+' sur le vocabulaire':'',
        parType('gram')?parType('gram')+' sur la grammaire':'',
        parType('texte')?parType('texte')+' sur la compréhension':''
      ].filter(Boolean).join(', ')}.</p>`:''}
    </div>
    ${faibles.length?`<h2 class="sec">Les erreurs</h2>
      ${faibles.map(([q,a])=>`<div class="box">
        <p class="${q.promptHan?'hz':''}" style="${q.promptHan?'font-size:21px;font-weight:700;':''}margin:0 0 6px">${esc(q.prompt)}</p>
        <p class="sm" style="margin:0"><span style="color:var(--red)">Votre réponse : ${esc(q.a[a])}</span></p>
        <p class="sm" style="margin:2px 0 0;color:var(--jade-d)">Attendu : ${esc(q.a[q.ok])}</p>
        ${q.why?`<p class="mut sm" style="margin:6px 0 0">${esc(q.why)}</p>`:''}
      </div>`).join('')}`:''}
    <button class="btn pale" onclick="qRestart()">Recommencer l’exercice</button>
    ${pass?`<button class="btn mt" onclick="finishStep()">Valider l’étape</button>`
          :`<button class="btn pale mt" onclick="back()">Revenir au parcours</button>`}`;
  }

  const q=Q.qs[Q.i],a=Q.ans[Q.i];
  const label={vocab:'Vocabulaire',gram:'Grammaire',texte:'Compréhension'}[q.kind];
  return header(titre,l.title)+`
  <div class="qnum">Question ${Q.i+1} sur ${Q.qs.length} · ${label}</div>
  <div class="qprog">${Q.qs.map((x,k)=>{
    const cl=k===Q.i?'now':(Q.ans[k]==null?'':(Q.ans[k]===x.ok?'ok':'no'));
    return `<i class="${cl}"></i>`;}).join('')}</div>
  <div class="box">
    <div class="prompt">
      <div class="${q.promptHan?'big':'med'}">${esc(q.prompt)}</div>
    </div>
    ${q.audio?`<button class="btn pale sm" onclick="speak('${jq(q.audio)}')">Écouter</button>`:''}
    <div class="opts">${q.a.map((opt,j)=>{
      let cl='';if(a!=null)cl=(j===q.ok)?'ok':(j===a?'no':'');
      return `<button class="opt ${q.han?'han':''} ${cl}" onclick="qAnswer(${j})">${esc(opt)}</button>`;
    }).join('')}</div>
    ${a!=null?`<div class="verdict ${a===q.ok?'ok':'no'}">${a===q.ok?'Juste.':'Réponse attendue : '+esc(q.a[q.ok])+'.'}${q.why?' '+esc(q.why):''}</div>
      <button class="btn" onclick="qNext()">${Q.i<Q.qs.length-1?'Suivant':'Voir le résultat'}</button>`:''}
  </div>`;
}

function openLesson(id){S.lastLesson=id;save();go('lecon',{l:id});}
function vLecon(){
  const l=LESSONS.find(x=>x.id===ctx.l);
  if(!l)return vParcours();
  const done=S.lessons[l.id]||[];
  const words=WORDS.filter(w=>w.hsk===l.hsk&&w.th.includes(l.theme));
  const m=words.filter(w=>mastered(w.id)).length;
  const steps=l.steps.map((s,i)=>{
    const isDone=done.includes(i);
    const open=isDone||i===0||done.includes(i-1);
    const state=isDone?'Terminé':open?'À faire':'Verrouillé';
    return `<button class="pstep ${isDone?'done':open?'open':''}"
      onclick="${open?`openStep('${l.id}',${i})`:`toast('Terminez d’abord l’étape précédente.')`}">
      <span class="pseal">${isDone?'✓':STEPMARK[s.k]||'·'}</span>
      <span class="lab"><b>${esc(s.label)}</b><span>${state}</span></span>
    </button>`;
  }).join('');
  return header(l.title,l.intro)+`
  <div class="box">
    <div class="bar"><i style="width:${done.length/l.steps.length*100}%;background:var(--red)"></i></div>
    <p class="mut sm" style="margin:10px 0 0">${done.length} / ${l.steps.length} étapes · ${m} mot${m>1?'s':''} acquis sur ${words.length}</p>
  </div>
  <div class="path">${steps}</div>
  ${done.length===l.steps.length?`<div class="box" style="text-align:center">
    <p class="hz" style="font-size:42px;margin:0;color:var(--red);font-weight:700">成</p>
    <p><b>Thème terminé</b></p>
    <p class="mut sm">Passez au niveau supérieur pour reprendre le même thème avec plus de moyens.</p></div>`:''}`;
}
function openStep(lid,i){
  const l=LESSONS.find(x=>x.id===lid),s=l.steps[i];
  const from={l:lid,i:i};
  if(s.k==='mots')return startQuiz(lid,'mots',i);
  if(s.k==='bilan')return startQuiz(lid,'bilan',i);
  if(s.k==='gram')return goPage('grammaire.html?g='+encodeURIComponent(s.ref)
    +'&l='+encodeURIComponent(lid)+'&i='+i+'&n='+l.steps.length);
  if(s.k==='prod')return go('prod',{p:s.ref,from:from});
  if(s.k==='chat')return go('chat',{from:from,lesson:lid});
  const t=TEXTS.find(x=>x.id===s.ref);
  if(s.k==='text')return go('decouv',{t:s.ref,from:from});
  return go(t.mode==='CO'?'co':'ce',{t:s.ref,from:from,doc:false});
}

function chatGram(theme,hsk){return GRAMMAR.filter(g=>g.hsk===hsk&&(g.th||[]).includes(theme));}
function chatThemes(){
  const h=S.settings.level;

}
function hasKey(){return S.settings.provider!=='none'&&!!(S.settings.apikey||'').trim();}

function chatSystem(c){
  const mots=chatWords(c.theme,c.hsk);
  const g=chatGram(c.theme,c.hsk)[0];
  const reg=REGISTERS.find(r=>r.id===c.reg)||REGISTERS[0];
  return `Tu es un partenaire de conversation chinois. Tu joues ce rôle : ${CHATROLE[c.theme]||'une personne qui bavarde avec l’apprenante'}.
Sujet de l’échange : ${themeName(c.theme)}. Niveau de l’apprenante : HSK ${c.hsk}.
${reg.consigne}

Vocabulaire autorisé. N’emploie aucun autre mot de contenu :
${mots.map(w=>w.hz+'  '+w.py+'  = '+w.fr).join('\n')}
Restent permis les outils grammaticaux de base : 的 了 吗 呢 吧 不 也 很 和 在 有 是 我 你 您 他 她 这 那 什么 谁 几 多少 怎么 可以 会 想 要 请.

${g?'Point de langue de la leçon, à faire apparaître naturellement dans tes questions : '+g.title+'.':''}

Règles absolues :
— Deux ou trois phrases courtes par tour, jamais davantage.
— Tu restes dans ton personnage. Aucune explication, aucune correction, aucune traduction à l’intérieur du message chinois.
${S.settings.chatOneQ===false
  ?'— Tu poses une ou deux questions par tour pour relancer l’échange.'
  :'— Tu poses UNE SEULE question par tour. Jamais deux, jamais trois. Une question, puis tu t’arrêtes.'}
— Le pinyin s’écrit SYLLABE PAR SYLLABE, séparées par des espaces, avec les marques de ton : « míng zi » et non « míngzi ». Exactement une syllabe par caractère chinois, ponctuation exclue.
— Tu réponds uniquement par un objet JSON conforme au schéma demandé.`;

/* ---- Appels Gemini : version d’API et mode d’authentification retenus ----
   Les clés récentes au préfixe AQ. n’acceptent pas toujours la clé dans
   l’URL. On mémorise la combinaison qui répond réellement. ---------------- */
function gURL(path,ver,auth){
  const k=(S.settings.apikey||'').trim();
  return 'https://generativelanguage.googleapis.com/'+(ver||S.settings.gver||'v1beta')+'/'+path+
    ((auth||S.settings.gauth||'query')==='query'?(path.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(k):'');
}
function gHead(auth){
  const h={'content-type':'application/json'};
  if((auth||S.settings.gauth||'query')==='header')h['x-goog-api-key']=(S.settings.apikey||'').trim();
  return h;
}
async function gErrMsg(r){
  let d=null;try{d=await r.json();}catch(e){}
  const e=(d&&d.error)||{};
  return {status:r.status,gstatus:e.status||'',message:e.message||''};
}
function authNom(a){return a==='header'?'en-tête':'URL';}

/* ---- Un appel de génération, avec le message d’erreur de Google ---- */
async function gemCall(model,sys,contents,schema){
  const body={contents:contents};
  if(sys)body.systemInstruction={parts:[{text:sys}]};
  body.generationConfig=schema
    ?{responseMimeType:'application/json',responseSchema:schema,temperature:.8}
    :{temperature:.8};
  let r;
  try{r=await fetch(gURL('models/'+model+':generateContent'),{method:'POST',headers:gHead(),body:JSON.stringify(body)});}
  catch(e){return {ok:false,status:0,msg:'réseau injoignable, ou requête bloquée par le navigateur'};}
  if(!r.ok){const e=await gErrMsg(r);
    return {ok:false,status:e.status,gstatus:e.gstatus,msg:(e.message||gemErr(e.status,'')).slice(0,220)};}
  let d={};try{d=await r.json();}catch(e){return {ok:false,status:200,msg:'réponse illisible'};}
  const txt=((d.candidates||[])[0]&&(d.candidates||[])[0].content&&(d.candidates||[])[0].content.parts||[])
            .map(x=>x.text||'').join('');
  if(!txt)return {ok:false,status:200,msg:'réponse vide — contenu peut-être bloqué par les filtres'};
  return {ok:true,txt:txt};
}

/* ---- Appel Gemini, sortie structurée ---- */
function gemErr(st,txt){
  if(st===400)return 'Requête refusée (400). La clé est probablement invalide ou incomplète.';
  if(st===401)return 'Clé non acceptée (401). Les clés récentes au préfixe AQ. sont souvent rejetées par cette API ; essayez une clé restreinte à l’API Generative Language.';
  if(st===403)return 'Accès refusé (403). L’API Generative Language n’est pas activée sur le projet, ou la clé n’a pas ce droit.';
  if(st===404)return 'Adresse ou modèle introuvable (404). Relancez « Tester la clé » : la sonde essaie les quatre combinaisons et dit laquelle répond.';
  if(st===429)return 'Quota épuisé (429). Réessayez plus tard.';
  if(st>=500)return 'Panne côté Google ('+st+'). Réessayez dans un moment.';
  return 'Erreur '+st+'.';
}
async function gemJSON(sys,contents,schema){
  const m=S.settings.gmodel||'gemini-flash-latest';
  const strict=S.settings.gjson!==false;
  const sys2=strict?sys:sys+'\n\nRéponds UNIQUEMENT par un objet JSON brut, sans balises de code ni commentaire.';
  const r=await gemCall(m,sys2,contents,strict?schema:null);
  if(!r.ok)throw new Error(r.msg+(r.status?' ('+r.status+')':''));
  try{return JSON.parse(String(r.txt).replace(/```json|```/g,'').trim());}
  catch(e){throw new Error('Réponse illisible du modèle.');}
}

/* ---- Garde-fou : le pinyin non conforme n’est pas affiché ---- */
function pyMsg(code){
  return code==='compte'?'il ne compte pas autant de syllabes que de caractères'
    :code==='syllabe'?'il contient une syllabe qui n’existe pas en mandarin'
    :code==='marque' ?'une marque de ton y est mal placée'
    :code==='vide'   ?'il est absent'
    :'il n’a pas passé le contrôle';
}
function chatGuard(o){
  const r=pinyinCheck(o.hz||'',o.py||'');
  o.pyOk=r.ok;o.pyCode=r.code;o.doute=r.doute||[];
  ['pistes','gloss'].forEach(k=>(o[k]||[]).forEach(p=>{p.pyOk=pinyinCheck(p.hz||'',p.py||'').ok;}));
  return o;
}

  const b=new Blob([JSON.stringify(chatLogRead(),null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='conversations-chinois.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}

/* ---- Conduite de la conversation ---- */
function chatStart(theme,reg){
  const hsk=S.settings.level;
  const sc=CHATSC.find(x=>x.theme===theme&&x.hsk===hsk);
  ctx.chat={theme:theme,hsk:hsk,reg:reg,turns:[],draft:'',busy:false,done:false,
            mode:hasKey()?'live':'guide',sc:sc||null,step:0,picks:[],err:''};
  if(ctx.chat.mode==='live')chatNext('(La conversation commence. Salue-moi et pose ta première question.)');
  else render();
}
function chatContents(c,dernier){
  const out=[];
  c.turns.forEach(t=>{
    if(t.who==='them')out.push({role:'model',parts:[{text:JSON.stringify({hz:t.hz,py:t.py,fr:t.fr,pistes:t.pistes||[]})}]});
    else out.push({role:'user',parts:[{text:t.hz}]});
  });
  out.push({role:'user',parts:[{text:dernier}]});
  return out;
}
async function chatNext(msg){
  const c=ctx.chat;if(!c||c.busy)return;
  c.busy=true;c.err='';render();
  try{
    const o=chatGuard(await gemJSON(chatSystem(c),chatContents(c,msg),CHAT_SCHEMA));
    c.turns.push(Object.assign({who:'them'},o));
  }catch(e){c.err=e.message||String(e);}
  c.busy=false;render();
}
function chatSend(txt){
  const c=ctx.chat;if(!c||c.busy)return;
  const t=(txt!=null?txt:(c.draft||'')).trim();
  if(!t)return;
  c.turns.push({who:'me',hz:t});
  c.draft='';
  const n=c.turns.filter(x=>x.who==='me').length;
  chatNext(n>=(S.settings.chatTurns||7)?t+'\n(C’est mon dernier tour : conclus brièvement.)':t);
}
function chatPiste(i){
  const c=ctx.chat,last=[...c.turns].reverse().find(t=>t.who==='them');
  if(!last||!last.pistes||!last.pistes[i])return;
  chatSend(last.pistes[i].hz);
}
async function chatFinish(){
  const c=ctx.chat;if(!c||c.busy)return;
  c.busy=true;c.err='';render();
  const mots=chatWords(c.theme,c.hsk);
  const sys=`Tu es professeur de chinois pour une apprenante francophone de niveau HSK ${c.hsk}.
Tu reçois une conversation. Tu n’examines QUE les tours de l’apprenante.
Pour chaque erreur : ce qu’elle a écrit, ce qui était attendu, la règle en UNE phrase, en français.
Le champ « mots » liste les mots de cette liste directement concernés, en caractères chinois, tels quels :
${mots.map(w=>w.hz).join(' ')}
Ajoute des reformulations plus naturelles quand la phrase est correcte mais maladroite.
Termine par un bilan de deux phrases, encourageant et précis. Réponds en JSON.`;
  const trans=c.turns.map(t=>(t.who==='me'?'APPRENANTE : ':'PARTENAIRE : ')+t.hz).join('\n');
  try{
    const d=await gemJSON(sys,[{role:'user',parts:[{text:trans}]}],DEB_SCHEMA);
    (d.reformulations||[]).forEach(r=>{r.pyOk=pinyinCheck(r.mieux||'',r.py||'').ok;});
    c.debrief=d;c.done=true;
    c.retro=chatRetro(d,c);
    chatLog(c);
  }catch(e){c.err=e.message||String(e);}
  c.busy=false;render();
}
function chatRetro(d,c){
  if(!S.settings.chatDemote)return 0;
  const mots=chatWords(c.theme,c.hsk),vus={};
  (d.erreurs||[]).forEach(e=>(e.mots||[]).forEach(m=>{
    const w=mots.find(x=>x.hz===m)||mots.find(x=>m&&String(m).includes(x.hz));
    if(w&&!vus[w.id]){vus[w.id]=1;grade(w.id,1);}
  }));
  return Object.keys(vus).length;
}

/* ---- Dialogue guidé, sans clé ---- */
function scPick(j){
  const c=ctx.chat,t=c.sc.turns[c.step];
  if(c.picks[c.step]!=null)return;
  c.picks[c.step]=j;
  beep(t.a[j].ok?'ok':'no');render();
}
function scNext(){
  const c=ctx.chat;
  if(c.step+1<c.sc.turns.length){c.step++;ctx.gpy=false;ctx.gfr=false;render();return;}
  c.done=true;c.turns=c.sc.turns.map((t,i)=>({who:'them',hz:t.hz,py:t.py,fr:t.fr}));
  chatLog(c);render();
}

/* ---- Écran ---- */
function chatShow(i,k){
  const t=ctx.chat&&ctx.chat.turns[i];if(!t)return;
  t[k]=!t[k];render();
}
function chatBubble(t,i){
  if(t.who==='me')return `<div class="bub me"><div class="sentence">${esc(t.hz)}</div></div>`;
  const py=t.pyOk!==false&&!!t.py;
  return `<div class="bub them">
    <div class="sentence">${esc(t.hz)}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn pale tiny" onclick="speak('${jq(t.hz)}','A')">Écouter</button>
      ${py?`<button class="btn pale tiny" onclick="chatShow(${i},'vpy')">${t.vpy?'Cacher le pinyin':'Pinyin'}</button>`:''}
      <button class="btn pale tiny" onclick="chatShow(${i},'vfr')">${t.vfr?'Cacher la traduction':'Traduction'}</button>
    </div>
    ${t.pyOk===false?`<p class="mut sm" style="margin:8px 0 0">Pinyin écarté : ${pyMsg(t.pyCode)}.</p>`:''}
    ${t.vpy&&py?`<div class="py sm" style="margin-top:9px">${pinyin(t.py)}</div>
      ${t.doute&&t.doute.length?`<p class="mut sm" style="margin:5px 0 0">Lecture à vérifier sur : ${t.doute.map(d=>esc(d.c)).join(' ')}</p>`:''}`:''}
    ${t.vfr?`<p class="mut sm" style="margin:9px 0 0">${esc(t.fr||'')}</p>
      ${(t.gloss||[]).length?`<p class="mut sm" style="margin:6px 0 0">${t.gloss.map(g=>esc(g.hz+' — '+g.fr)).join(' · ')}</p>`:''}`:''}
  </div>`;
}
function vChat(){
  const c=ctx.chat;
  if(!c)return chatSetup();
  const dernier=[...c.turns].reverse().find(t=>t.who==='them');
  const nMoi=c.turns.filter(t=>t.who==='me').length;
  const max=S.settings.chatTurns||7;
  if(c.mode==='guide')return chatGuide(c);
  return header('聊 — '+themeName(c.theme),'HSK '+c.hsk+' · tour '+Math.min(nMoi+1,max)+' sur '+max)+ribbon()+`
  ${c.turns.map(chatBubble).join('')}
  ${c.busy?`<div class="box"><p class="mut sm" style="margin:0">Votre interlocuteur écrit…</p></div>`:''}
  ${c.err?`<div class="verdict no">${esc(c.err)}</div>
    <button class="btn pale sm mt" onclick="chatNext('(Reprends.)')">Réessayer</button>`:''}
  ${c.done?chatDebriefBlock(c):`
  ${dernier&&(dernier.pistes||[]).length&&!c.busy?`<h2 class="sec">Pistes de réponse</h2>
    <div class="opts">${dernier.pistes.map((p,i)=>`<button class="opt han" onclick="chatPiste(${i})">
      ${esc(p.hz)}<span class="mut sm"> — ${esc(p.fr)}</span></button>`).join('')}</div>`:''}
  <h2 class="sec">Ma réponse</h2>
  <div class="box">
    <textarea rows="2" placeholder="Écrivez en chinois, au clavier" oninput="ctx.chat.draft=this.value">${esc(c.draft||'')}</textarea>
    <button class="btn red mt" onclick="chatSend()">Envoyer</button>
    ${nMoi>=4?`<button class="btn pale sm mt" onclick="chatFinish()">Terminer et faire le point</button>`:''}
  </div>`}`;
}
function chatDebriefBlock(c){
  const d=c.debrief||{};
  return `<h2 class="sec">Le point sur cet échange</h2>
  <div class="box"><p style="margin:0">${esc(d.bilan||'')}</p></div>
  ${(d.erreurs||[]).length?(d.erreurs||[]).map(e=>`<div class="box">
    <p class="hz" style="margin:0 0 5px"><b>${esc(e.ecrit||'')}</b></p>
    <p class="hz" style="margin:0 0 7px;color:var(--jade)">${esc(e.attendu||'')}</p>
    <p class="mut sm" style="margin:0">${esc(e.regle||'')}</p></div>`).join('')
    :`<div class="box"><p class="mut sm" style="margin:0">Aucune erreur relevée.</p></div>`}
  ${(d.reformulations||[]).length?`<h2 class="sec">Plus naturel</h2>
  ${d.reformulations.map(r=>`<div class="box">
    <p class="mut sm" style="margin:0 0 5px">${esc(r.ecrit||'')}</p>
    <div class="sentence">${esc(r.mieux||'')}</div>
    ${r.pyOk&&r.py?`<div class="py sm">${pinyin(r.py)}</div>`:''}
    ${r.fr?`<p class="mut sm" style="margin:6px 0 0">${esc(r.fr)}</p>`:''}</div>`).join('')}`:''}
  ${c.retro?`<div class="box"><p class="mut sm" style="margin:0">${c.retro} mot${c.retro>1?'s':''} ${c.retro>1?'redescendus':'redescendu'} d’une boîte pour être revu${c.retro>1?'s':''} plus tôt.</p></div>`:''}
  <button class="btn pale mt" onclick="ctx.chat=null;render()">Nouvelle conversation</button>`;
}
function chatGuide(c){
  const t=c.sc.turns[c.step],pick=c.picks[c.step];
  const justes=c.picks.filter((p,i)=>p!=null&&c.sc.turns[i].a[p].ok).length;
  if(c.done)return header('聊 — '+esc(c.sc.titre),'Dialogue guidé')+ribbon()+`
    <div class="box"><p><b>Dialogue terminé.</b></p>
      <p class="mut sm">${justes} réponse${justes>1?'s':''} juste${justes>1?'s':''} sur ${c.sc.turns.length}.</p></div>
    ${c.sc.turns.map((x,i)=>`<div class="bub them"><div class="sentence">${esc(x.hz)}</div>
      <div class="py sm" style="margin-top:7px">${pinyin(x.py)}</div>
      <p class="mut sm" style="margin:7px 0 0">${esc(x.fr)}</p></div>
      <div class="bub me"><div class="sentence">${esc(x.a[c.picks[i]!=null?c.picks[i]:x.a.findIndex(a=>a.ok)].hz)}</div></div>`).join('')}
    <div class="box"><p class="mut sm" style="margin:0">Avec une clé Gemini dans les Réglages, cette étape devient une vraie conversation libre.</p></div>
    <button class="btn pale mt" onclick="ctx.chat=null;render()">Recommencer</button>`;
  return header('聊 — '+esc(c.sc.titre),'Dialogue guidé · réplique '+(c.step+1)+' sur '+c.sc.turns.length)+ribbon()+`
  <div class="box"><p class="mut sm" style="margin:0">${esc(c.sc.role)}</p></div>
  <div class="bub them">
    <div class="sentence">${esc(t.hz)}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn pale tiny" onclick="speak('${jq(t.hz)}','A')">Écouter</button>
      <button class="btn pale tiny" onclick="ctx.gpy=!ctx.gpy;render()">${ctx.gpy?'Cacher le pinyin':'Pinyin'}</button>
      <button class="btn pale tiny" onclick="ctx.gfr=!ctx.gfr;render()">${ctx.gfr?'Cacher la traduction':'Traduction'}</button>
    </div>
    ${ctx.gpy?`<div class="py sm" style="margin-top:9px">${pinyin(t.py)}</div>`:''}
    ${ctx.gfr?`<p class="mut sm" style="margin:9px 0 0">${esc(t.fr)}</p>`:''}
  </div>
  <h2 class="sec">Que répondez-vous ?</h2>
  <div class="opts">${t.a.map((a,j)=>{
    let cl='';if(pick!=null)cl=a.ok?'ok':(j===pick?'no':'');
    return `<button class="opt han ${cl}" onclick="scPick(${j})">${esc(a.hz)}
      ${pick!=null?`<span class="mut sm"> — ${esc(a.fr)}</span>`:''}</button>`;}).join('')}</div>
  ${pick!=null?`<div class="verdict ${t.a[pick].ok?'ok':'no'}">${t.a[pick].ok?'Juste.':esc(t.a[pick].why||'Ce n’est pas la bonne réponse.')}</div>
    <button class="btn red mt" onclick="scNext()">${c.step+1<c.sc.turns.length?'Réplique suivante':'Terminer'}</button>`:''}`;
}
function chatSetup(){
  const th=chatThemes(),h=S.settings.level;
  const dispo=th.filter(t=>chatWords(t.id,h).length>=6||CHATSC.some(x=>x.theme===t.id&&x.hsk===h));
  ctx.creg=ctx.creg||(h<=2?'reg2':'reg3');
  ctx.cth=ctx.cth||(dispo.some(t=>t.id===S.settings.theme)?S.settings.theme:(dispo[0]||{}).id);
  if(!dispo.length)return header('聊 — Conversation')+levelPills()+nothing();
  return header('聊 — Conversation','Dialoguer sur un thème, puis faire le point')+ribbon()+`
  ${levelPills()}
  <div class="box">
    <p class="mut sm" style="margin:0 0 8px">Thème</p>
    <div class="selwrap"><select onchange="ctx.cth=this.value;render()">
      ${dispo.map(t=>`<option value="${t.id}" ${ctx.cth===t.id?'selected':''}>${esc(t.n)}</option>`).join('')}
    </select></div>
    <p class="mut sm" style="margin:14px 0 8px">Registre</p>
    ${REGISTERS.map(r=>`<button class="wrow" style="width:100%;text-align:left;${ctx.creg===r.id?'border-color:var(--jade)':''}"
      onclick="ctx.creg='${r.id}';render()">
      <span class="m"><b style="${ctx.creg===r.id?'color:var(--jade)':''}">${esc(r.n)}</b><span class="mut">${esc(r.d)}</span></span>
      ${ctx.creg===r.id?'<span class="seal">选</span>':''}</button>`).join('')}
  </div>
  <div class="box">
    ${hasKey()
      ?`<p class="sm" style="margin:0"><b>Conversation libre.</b> <span class="mut">Votre partenaire s’en tient aux ${chatWords(ctx.cth,h).length} mots du thème. ${S.settings.chatTurns} tours, puis le point sur vos phrases.</span></p>`
      :`<p class="sm" style="margin:0"><b>Dialogue guidé.</b> <span class="mut">Sans clé, l’échange se fait à choix multiples, quatre répliques. Ajoutez une clé Gemini dans les Réglages pour la conversation libre.</span></p>`}
  </div>
  <button class="btn red mt" onclick="chatStart(ctx.cth,ctx.creg)">Commencer</button>`;
}

/* ---------- Progrès ---------- */
function vProgres(){
  const all=WORDS.concat(CHARS);
  const seen=all.filter(w=>S.items[w.id]).length;
  const mast=all.filter(w=>mastered(w.id)).length;
  const todo=pool().filter(w=>due(w.id)).length;
  const boxes=[0,1,2,3,4,5].map(b=>all.filter(w=>S.items[w.id]&&S.items[w.id].box===b).length);
  const maxb=Math.max(1,...boxes);
  const stepsAll=LESSONS.reduce((n,l)=>n+l.steps.length,0);
  const stepsDone=LESSONS.reduce((n,l)=>n+lessonProgress(l),0);
  const pcent=stepsAll?Math.round(stepsDone/stepsAll*100):0;
  return `<div class="top"><div class="htitle">Mes progrès<small>Tous niveaux confondus</small></div></div>
  <div class="grid2">
    <div class="kpi"><b style="color:var(--red)">${todo}</b><span>à réviser au filtre</span></div>
    <div class="kpi"><b style="color:var(--gold-d)">${seen}</b><span>mots rencontrés</span></div>
    <div class="kpi"><b style="color:var(--jade)">${mast}</b><span>mots acquis</span></div>
    <div class="kpi"><b style="color:var(--indigo)">${S.written.length}</b><span>écrits produits</span></div>
  </div>
  <h2 class="sec">Répartition par boîte</h2>
  <div class="box">
    ${boxes.map((n,b)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      <span class="mut sm" style="width:56px;flex:none">Boîte ${b}</span>
      <span class="bar" style="flex:1"><i style="width:${n/maxb*100}%;background:${b>=4?'var(--jade)':b>=2?'var(--gold)':'var(--red)'}"></i></span>
      <span class="sm" style="width:24px;text-align:right">${n}</span></div>`).join('')}
    <p class="mut sm" style="margin:10px 0 0">Un mot monte d’une boîte à chaque réussite. Boîte 4 ou 5 = acquis. Un échec le renvoie en boîte 0. Les mots des boîtes basses sortent en priorité dans les exercices des parcours.</p>
  </div>
  <h2 class="sec">Parcours</h2>
  <div class="box">
    <div class="bar"><i style="width:${pcent}%;background:var(--red)"></i></div>
    <p class="mut sm" style="margin:10px 0 0">${stepsDone} étape${stepsDone>1?'s':''} validée${stepsDone>1?'s':''} sur ${stepsAll}, tous parcours et tous niveaux confondus — ${pcent} %.</p>
  </div>
  ${LESSONS.map(l=>{const p=(S.lessons[l.id]||[]).length;
    return `<div class="wrow"><span class="g" style="font-family:var(--ui);font-size:19px;color:var(--red)">${p>=l.steps.length?'成':'路'}</span>
    <span class="m"><b>${esc(l.title)}</b><span class="mut">${p} / ${l.steps.length} étapes</span>
    <span class="bar" style="margin-top:6px"><i style="width:${p/l.steps.length*100}%;background:var(--red)"></i></span></span></div>`;}).join('')}`;
}

}
